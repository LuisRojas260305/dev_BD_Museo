<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestionar Reservas</title>
  <link rel="stylesheet" href="/css/museo.css">
  <style>
    .page-wrap { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
    h2 { font-family: var(--font-serif); font-size: 1.35rem; font-weight: 400; color: var(--text); margin-bottom: 1.2rem; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow); }
    th, td { padding: 0.8rem 1rem; text-align: left; border-bottom: 1px solid var(--border-light); font-size: 0.88rem; }
    th { background: var(--text); color: rgba(245,241,232,0.85); font-weight: 500; font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; }
    td { color: var(--text-muted); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--warm-white); }
    .btn { background: var(--wine); color: white; border: none; padding: 0.4rem 0.85rem; border-radius: var(--radius-sm); cursor: pointer; text-decoration: none; display: inline-block; margin: 0.2rem; font-size: 0.82rem; font-family: var(--font-sans); transition: background 0.2s; }
    .btn:hover { background: var(--wine-dark); }
    .btn-danger { background: #b91c1c; }
    .btn-danger:hover { background: #991b1b; }
    .btn-success { background: var(--wine); }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.55); align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: var(--surface); padding: 1.8rem; border-radius: var(--radius-md); max-width: 440px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.25); animation: fadeUp 0.25s ease; }
    .modal-content h3 { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 400; margin-bottom: 1rem; }
    .modal-content label { display: block; margin-bottom: 0.3rem; font-size: 0.82rem; color: var(--text-muted); }
    .modal-content input[type=text] { width: 100%; padding: 0.5rem 0.7rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font-sans); margin: 0.5rem 0 1rem; color: var(--text); background: var(--cream); }
    .modal-content input:focus { outline: none; border-color: var(--wine); }
  </style>
</head>
<body>
<header class="m-header">
  <a class="m-logo" href="../admin-dashboard.html"><img src="/img/logo.png" alt="Museo de arte contemporáneo"></a>
  <nav class="m-nav">
    <span style="color:rgba(245,241,232,0.55);font-size:.83rem" id="userEmail"></span>
    <a href="../../index.html" class="btn-secondary">Ver sitio</a>
    <a class="btn-primary" style="cursor:pointer" onclick="logout()">Salir</a>
  </nav>
</header>
<div class="page-wrap">
  <a class="back-link" href="../admin-dashboard.html">Volver al panel</a>
  <h2>Reservas pendientes</h2>
        <table id="tablaReservas">
            <thead>
                <tr>
                    <th>ID Venta</th>
                    <th>Obra</th>
                    <th>Artista</th>
                    <th>Comprador</th>
                    <th>Fecha reserva</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="reservasBody">
                <tr><td colspan="6">Cargando...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Modal para dirección de envío -->
    <div id="modalEnvio" class="modal">
        <div class="modal-content">
            <h3>Concretar venta</h3>
            <label for="direccion">Dirección de envío:</label>
            <input type="text" id="direccion" style="width:100%; padding:0.5rem; margin:1rem 0;">
            <button class="btn btn-success" id="confirmarEnvio">Confirmar</button>
            <button class="btn" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>

<footer class="m-footer"><span>&copy; 2026 Museo de arte contemporáneo</span>
  <a class="footer-github" href="https://github.com/LuisRojas260305/dev_BD_Museo/" target="_blank" aria-label="Repositorio en GitHub"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.74.08-.73.08-.73 1.21.09 1.85 1.24 1.85 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0 2.04.14 3 .4 2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.93.43.37.82 1.1.82 2.22v3.29c0 .32.22.7.83.58C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg></a></footer>

    <script src="../../../js/auth.js"></script>
    <script>
        // Gestión de Reservas - Concretar o cancelar reservas de obras pendientes.
        // API: /ventas (GET con estado=reservada, PUT para concretar/cancelar).
        // auth.js (getUser, authFetch para autenticación).

        let ventaSeleccionada = null;

        (function() {
            const user = getUser();
            
            if (!user || user.tipo !== 'administrador') {
                alert('Acceso no autorizado');
                window.location.href = '../../index.html';
            }
                
            document.getElementById('userEmail').innerText = user.email;
        })();

        
        async function cargarReservas() {
            try {
                const res = await authFetch(`${API_BASE}/ventas?estado=reservada`);
                if (!res.ok) throw new Error('Error al cargar reservas');
                const reservas = await res.json();
                const tbody = document.getElementById('reservasBody');
                if (reservas.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6">No hay reservas pendientes</td></tr>';
                    return;
                }
                tbody.innerHTML = '';
                reservas.forEach(v => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${v.venta_id}</td>
                        <td>${v.obra_nombre}</td>
                        <td>${v.artista_nombre}</td>
                        <td>${v.comprador_nombre} (${v.comprador_email})</td>
                        <td>${new Date(v.fecha_reserva).toLocaleDateString()}</td>
                        <td>
                            <button class="btn btn-success" onclick="abrirModalConcretar(${v.venta_id})">Concretar</button>
                            <button class="btn btn-danger" onclick="cancelarReserva(${v.venta_id})">Cancelar</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                document.getElementById('reservasBody').innerHTML = '<tr><td colspan="6">Error al cargar</td></tr>';
            }
        }

        
        function abrirModalConcretar(ventaId) {
            ventaSeleccionada = ventaId;
            document.getElementById('modalEnvio').style.display = 'flex';
        }

        
        function cerrarModal() {
            document.getElementById('modalEnvio').style.display = 'none';
            ventaSeleccionada = null;
        }

        
        document.getElementById('confirmarEnvio').addEventListener('click', async function() {
            const direccion = document.getElementById('direccion').value.trim();
            if (!direccion) {
                alert('Debe ingresar una dirección de envío');
                return;
            }
            try {
                const res = await authFetch(`${API_BASE}/ventas/${ventaSeleccionada}/concretar`, {
                    method: 'PUT',
                    body: JSON.stringify({ direccion_envio: direccion })
                });
                if (res.ok) {
                    alert('Venta concretada y factura generada');
                    cerrarModal();
                    cargarReservas();
                } else {
                    const err = await res.json();
                    alert('Error: ' + err.error);
                }
            } catch (error) {
                alert('Error de conexión');
            }
        });

        
        async function cancelarReserva(ventaId) {
            if (!confirm('¿Está seguro de cancelar esta reserva? La obra volverá a estar disponible.')) return;
            try {
                const res = await authFetch(`${API_BASE}/ventas/${ventaId}/cancelar`, { method: 'PUT' });
                if (res.ok) {
                    alert('Reserva cancelada');
                    cargarReservas();
                } else {
                    const err = await res.json();
                    alert('Error: ' + err.error);
                }
            } catch (error) {
                alert('Error de conexión');
            }
        }

        cargarReservas();
    </script>
</body>
</html>

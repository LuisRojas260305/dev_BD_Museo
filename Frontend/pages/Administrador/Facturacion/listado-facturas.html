<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de Facturas</title>
  <link rel="stylesheet" href="/css/museo.css">
  <style>
    .page-wrap { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
    h2 { font-family: var(--font-serif); font-size: 1.35rem; font-weight: 400; color: var(--text); margin-bottom: 1.2rem; }
    .filters { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; align-items: flex-end; }
    .filter-group { display: flex; flex-direction: column; }
    .filter-group label { font-size: 0.78rem; font-weight: 500; color: var(--text-muted); margin-bottom: 0.25rem; }
    .filter-group input { padding: 0.5rem 0.7rem; border: 1px solid var(--border); border-radius: var(--radius-sm); width: 180px; font-family: var(--font-sans); color: var(--text); background: var(--cream); }
    .filter-group input:focus { outline: none; border-color: var(--wine); }
    .btn { background: var(--wine); color: white; border: none; padding: 0.5rem 1.1rem; border-radius: var(--radius-sm); cursor: pointer; font-family: var(--font-sans); font-size: 0.88rem; transition: background 0.2s; }
    .btn:hover { background: var(--wine-dark); }
    .btn-small { padding: 0.3rem 0.65rem; font-size: 0.78rem; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow); margin-top: 0.5rem; }
    th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border-light); font-size: 0.88rem; }
    th { background: var(--text); color: rgba(245,241,232,0.85); font-weight: 500; font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; }
    td { color: var(--text-muted); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--warm-white); }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.55); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: var(--surface); padding: 1.8rem; border-radius: var(--radius-md); max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.25); animation: fadeUp 0.25s ease; }
    .modal-content h3 { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 400; margin-bottom: 1rem; }
    .modal-content p { margin: 0.4rem 0; font-size: 0.88rem; color: var(--text-muted); }
    .modal-content p strong { color: var(--text); }
    .close { float: right; font-size: 1.4rem; cursor: pointer; color: var(--text-light); }
    .hidden { display: none; }
    @media (max-width: 768px) { .filters { flex-direction: column; } }
  </style>
</head>
<body>
<header class="m-header">
  <a class="m-logo" href="../admin-dashboard.html"><img src="/img/logo.png" alt="Museo de arte contemporáneo"></a>
  <nav class="m-nav">
    <a href="../../index.html" class="btn-secondary">Ver sitio</a>
    <a class="btn-primary" style="cursor:pointer" onclick="logout()">Salir</a>
  </nav>
</header>
<div class="page-wrap">
  <a class="back-link" href="../admin-dashboard.html">Volver al panel</a>
  <h2>Listado de facturas</h2>

        <!-- Filtros (opcional, por ahora sin funcionalidad) -->
        <div class="filters">
            <div class="filter-group">
                <label for="fechaInicio">Fecha desde</label>
                <input type="date" id="fechaInicio">
            </div>
            <div class="filter-group">
                <label for="fechaFin">Fecha hasta</label>
                <input type="date" id="fechaFin">
            </div>
            <button class="btn" onclick="cargarFacturas()">Aplicar filtros</button>
        </div>

        <!-- Tabla de facturas -->
        <div style="overflow-x:auto;">
            <table id="tablaFacturas">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Obra</th>
                        <th>Comprador</th>
                        <th>Fecha</th>
                        <th>Total</th>
                        <th>Ganancia museo</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="facturasBody">
                    <tr><td colspan="7" style="text-align:center;">Cargando facturas...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal para detalles de factura -->
    <div id="modalFactura" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal()">&times;</span>
            <h3 id="modalTitulo">Detalle de Factura</h3>
            <div id="modalBody"></div>
        </div>
    </div>

<footer class="m-footer"><span>&copy; 2026 Museo de arte contemporáneo</span>
  <a class="footer-github" href="https://github.com/LuisRojas260305/dev_BD_Museo/" target="_blank" aria-label="Repositorio en GitHub"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.74.08-.73.08-.73 1.21.09 1.85 1.24 1.85 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0 2.04.14 3 .4 2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.93.43.37.82 1.1.82 2.22v3.29c0 .32.22.7.83.58C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg></a></footer>

    <script src="../../../js/auth.js"></script>
    <script>
        // Listado de Facturas - Visualización de facturas emitidas con filtros por fecha.
        // API: /ventas/facturas (GET), /ventas/facturas/{id} (GET detalle).
        // auth.js (getUser, authFetch para autenticación).

        (function() {
            const user = getUser();
            if (!user || user.tipo !== 'administrador') {
                alert('Acceso no autorizado');
                window.location.href = '../../index.html';
            }
        })();

        
        async function cargarFacturas() {
            // Por ahora no se envían filtros de fecha; el backend filtra internamente.
            const url = `${API_BASE}/ventas/facturas`;

            try {
                const res = await authFetch(url);
                if (!res.ok) throw new Error('Error al cargar facturas');
                const facturas = await res.json();
                renderFacturas(facturas);
            } catch (error) {
                console.error(error);
                document.getElementById('facturasBody').innerHTML = `<tr><td colspan="7" style="color:#e74c3c;">Error: ${error.message}</td></tr>`;
            }
        }

        
        function renderFacturas(facturas) {
            const tbody = document.getElementById('facturasBody');
            if (!facturas || facturas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No hay facturas para mostrar</td></tr>';
                return;
            }

            let html = '';
            facturas.forEach(f => {
                const fecha = new Date(f.fecha_emision).toLocaleDateString();
                const total = Number(f.total).toFixed(2);
                const ganancia = Number(f.ganancia_museo).toFixed(2);
                html += `
                    <tr>
                        <td>${f.factura_id}</td>
                        <td>${f.obra_nombre || 'N/A'}</td>
                        <td>${f.comprador_nombre || 'N/A'}</td>
                        <td>${fecha}</td>
                        <td>$${total}</td>
                        <td>$${ganancia}</td>
                        <td><button class="btn btn-small" onclick="verDetalle(${f.factura_id})">Ver</button></td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        
        async function verDetalle(id) {
            try {
                const res = await authFetch(`${API_BASE}/ventas/facturas/${id}`);
                if (!res.ok) throw new Error('No se pudo obtener el detalle');
                const factura = await res.json();

                const modalBody = document.getElementById('modalBody');
                modalBody.innerHTML = `
                    <p><strong>Factura ID:</strong> ${factura.factura_id}</p>
                    <p><strong>Venta ID:</strong> ${factura.venta_id}</p>
                    <p><strong>Obra:</strong> ${factura.obra_nombre}</p>
                    <p><strong>Artista:</strong> ${factura.artista_nombre}</p>
                    <p><strong>Comprador:</strong> ${factura.comprador_nombre} (${factura.comprador_email})</p>
                    <p><strong>Dirección envío:</strong> ${factura.direccion_envio}</p>
                    <p><strong>Fecha emisión:</strong> ${new Date(factura.fecha_emision).toLocaleString()}</p>
                    <p><strong>Precio obra:</strong> $${Number(factura.precio_obra).toFixed(2)}</p>
                    <p><strong>IVA (16%):</strong> $${Number(factura.iva).toFixed(2)}</p>
                    <p><strong>Total con IVA:</strong> $${Number(factura.total).toFixed(2)}</p>
                    <p><strong>% Ganancia museo:</strong> ${factura.porcentaje_ganancia}%</p>
                    <p><strong>Ganancia museo:</strong> $${Number(factura.ganancia_museo).toFixed(2)}</p>
                `;
                document.getElementById('modalTitulo').innerText = `Factura #${factura.factura_id}`;
                document.getElementById('modalFactura').style.display = 'flex';
            } catch (error) {
                alert('Error al cargar detalle: ' + error.message);
            }
        }

        
        function cerrarModal() {
            document.getElementById('modalFactura').style.display = 'none';
        }

        // Cargar facturas al iniciar la página.
        cargarFacturas();

        
        window.logout = function() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        };

        // Cerrar modal si se hace clic fuera del contenido.
        window.onclick = function(event) {
            const modal = document.getElementById('modalFactura');
            if (event.target === modal) {
                cerrarModal();
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Obras Vendidas</title>
  <link rel="stylesheet" href="/css/museo.css">
  <style>
    .page-wrap { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
    h2 { font-family: var(--font-serif); font-size: 1.35rem; font-weight: 400; color: var(--text); margin-bottom: 1.2rem; }
    .form-group { margin-bottom: 0.9rem; }
    label { display: block; margin-bottom: 0.3rem; font-size: 0.82rem; font-weight: 500; color: var(--text-muted); }
    input:not([type=file]):not([type=checkbox]), select { width: 100%; padding: 0.5rem 0.7rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.88rem; font-family: var(--font-sans); color: var(--text); background: var(--cream); box-sizing: border-box; }
    input:focus, select:focus { outline: none; border-color: var(--wine); }
    .filter-row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-end; margin-bottom: 1.5rem; }
    .filter-row .form-group { margin-bottom: 0; }
    .filter-row input { width: 180px; }
    .btn { background: var(--wine); color: white; border: none; padding: 0.5rem 1.1rem; border-radius: var(--radius-sm); cursor: pointer; font-family: var(--font-sans); font-size: 0.88rem; transition: background 0.2s; }
    .btn:hover { background: var(--wine-dark); }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow); margin-top: 1rem; }
    th, td { padding: 0.8rem 1rem; text-align: left; border-bottom: 1px solid var(--border-light); font-size: 0.88rem; }
    th { background: var(--text); color: rgba(245,241,232,0.85); font-weight: 500; font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; }
    td { color: var(--text-muted); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--warm-white); }
  </style>
</head>
<body>
<header class="m-header">
  <a class="m-logo" href="../admin-dashboard.html"><img src="/img/logo.png" alt="Museo de arte contemporáneo"></a>
  <nav class="m-nav">
    <span style="color:rgba(245,241,232,0.55);font-size:.83rem" id="userEmail"></span>
    <a href="../../index.html" class="btn-secondary">Ver sitio</a>
    <a class="btn-primary" style="cursor:pointer" onclick="logout()">Salir</a>
  </nav>
</header>
<div class="page-wrap">
  <a class="back-link" href="../admin-dashboard.html">Volver al panel</a>
  <h2>Consulta de obras vendidas por período</h2>
  <form id="periodoForm">
    <div class="filter-row">
      <div class="form-group">
        <label for="fechaInicio">Fecha inicio</label>
        <input type="date" id="fechaInicio" required style="width:180px">
      </div>
      <div class="form-group">
        <label for="fechaFin">Fecha fin</label>
        <input type="date" id="fechaFin" required style="width:180px">
      </div>
      <button type="submit" class="btn" style="margin-bottom:0.3rem">Consultar</button>
    </div>
  </form>
        <div id="resultado">
            <table>
                <thead><tr><th>Factura</th><th>Obra</th><th>Comprador</th><th>Fecha</th><th>Precio</th><th>Total + IVA</th></tr></thead>
                <tbody id="tablaVentas"></tbody>
            </table>
        </div>
    </div>
<footer class="m-footer"><span>&copy; 2026 Museo de arte contemporáneo</span>
  <a class="footer-github" href="https://github.com/LuisRojas260305/dev_BD_Museo/" target="_blank" aria-label="Repositorio en GitHub"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.74.08-.73.08-.73 1.21.09 1.85 1.24 1.85 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0 2.04.14 3 .4 2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.93.43.37.82 1.1.82 2.22v3.29c0 .32.22.7.83.58C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg></a></footer>

    <script src="../../../js/auth.js"></script>
    <script>
        // Consulta de Obras Vendidas - Filtra ventas por período y muestra resultados.
        // API: /ventas (GET con estado=vendida, desde, hasta).
        // auth.js (getUser, authFetch para autenticación).

        (function() {
            const user = getUser();
            if (!user || user.tipo !== 'administrador') {
                alert('Acceso no autorizado');
                window.location.href = '../../index.html';
            }
            document.getElementById('userEmail').innerText = user.email;
        })();

        
        function parseFechaLocal(fechaStr) {
            const [year, month, day] = fechaStr.split('-').map(Number);
            return new Date(year, month - 1, day);
        }

        
        document.getElementById('periodoForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const fechaInicio = document.getElementById('fechaInicio').value;
            const fechaFin = document.getElementById('fechaFin').value;

            if (!fechaInicio || !fechaFin) {
                alert('Debe seleccionar ambas fechas');
                return;
            }

            // Construir URL con filtros: estado=vendida + fechas (si el backend las soporta)
            const params = new URLSearchParams({
                estado: 'vendida',          // <-- Solo ventas vendidas
                desde: fechaInicio,
                hasta: fechaFin
            });

            try {
                const response = await authFetch(`${API_BASE}/ventas?${params}`);
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Error al obtener ventas');
                }
                const ventas = await response.json();

                // Si el backend no filtró por fechas, podemos filtrar manualmente:
                const inicio = parseFechaLocal(fechaInicio);
                const fin = parseFechaLocal(fechaFin);
                fin.setHours(23, 59, 59, 999);

                const filtradas = ventas.filter(v => {
                    // Asegurar que solo se consideren las vendidas (por si acaso)
                    if (v.estado !== 'vendida') return false;
                    const fechaVenta = v.fecha_venta ? new Date(v.fecha_venta) : null;
                    return fechaVenta && fechaVenta >= inicio && fechaVenta <= fin;
                });

                renderVentas(filtradas);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('tablaVentas').innerHTML = `<tr><td colspan="6" style="color:#e74c3c;">Error: ${error.message}</td></tr>`;
            }
        });

        
        function renderVentas(ventas) {
            const tbody = document.getElementById('tablaVentas');
            tbody.innerHTML = '';

            if (!ventas || ventas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">No hay ventas en el período</td></tr>';
                return;
            }

            ventas.forEach(v => {
                // Depuración: mira la consola para ver la estructura real
                console.log('Venta:', v);

                // ID de la venta/factura
                const id = v.venta_id || v.id || v.factura_id || 'N/A';

                // Nombre de la obra
                const obra = v.obra_nombre || v.nombre_obra || 'N/A';

                // Nombre del comprador
                const comprador = v.comprador_nombre || v.nombre_comprador || 'N/A';

                // Fecha: usar fecha_venta (para vendidas)
                let fechaStr = 'Fecha no disponible';
                if (v.fecha_venta) {
                    fechaStr = new Date(v.fecha_venta).toLocaleDateString();
                } else if (v.fecha_emision) {
                    fechaStr = new Date(v.fecha_emision).toLocaleDateString();
                } else if (v.fecha) {
                    fechaStr = new Date(v.fecha).toLocaleDateString();
                }

                // Precio de la obra (sin IVA) - en gestión de ventas es precio_venta
                let precio = 0;
                if (v.precio_venta !== undefined) {
                    precio = Number(v.precio_venta);
                } else if (v.precio_obra !== undefined) {
                    precio = Number(v.precio_obra);
                } else if (v.precio !== undefined) {
                    precio = Number(v.precio);
                }
                const precioStr = isNaN(precio) ? 'N/A' : `$${precio.toFixed(2)}`;

                // Total con IVA (asumimos 16% si no viene del backend)
                let total = 0;
                if (v.total !== undefined) {
                    total = Number(v.total);
                } else if (v.total_con_iva !== undefined) {
                    total = Number(v.total_con_iva);
                } else if (!isNaN(precio)) {
                    total = precio * 1.16;  // 16% de IVA
                }
                const totalStr = isNaN(total) ? 'N/A' : `$${total.toFixed(2)}`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${id}</td>
                    <td>${obra}</td>
                    <td>${comprador}</td>
                    <td>${fechaStr}</td>
                    <td>${precioStr}</td>
                    <td>${totalStr}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        
        window.logout = function() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Artistas</title>
  <link rel="stylesheet" href="/css/museo.css">
  <style>
    .page-wrap { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
    h2 { font-family: var(--font-serif); font-size: 1.35rem; font-weight: 400; color: var(--text); margin-bottom: 1.2rem; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow); }
    th, td { padding: 0.8rem 1rem; text-align: left; border-bottom: 1px solid var(--border-light); font-size: 0.88rem; }
    th { background: var(--text); color: rgba(245,241,232,0.85); font-weight: 500; font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; }
    td { color: var(--text-muted); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--warm-white); }
    .form-container { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; animation: fadeUp 0.3s ease; }
    .form-container h3 { font-family: var(--font-serif); font-size: 1.05rem; font-weight: 500; margin-bottom: 1rem; color: var(--text); }
    .hidden { display: none; }
    .form-group { margin-bottom: 0.9rem; }
    label { display: block; margin-bottom: 0.3rem; font-size: 0.82rem; font-weight: 500; color: var(--text-muted); }
    input:not([type=file]):not([type=checkbox]), select, textarea { width: 100%; padding: 0.5rem 0.7rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.88rem; font-family: var(--font-sans); color: var(--text); background: var(--cream); box-sizing: border-box; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--wine); }
    .btn { background: var(--wine); color: white; border: none; padding: 0.45rem 0.9rem; border-radius: var(--radius-sm); cursor: pointer; text-decoration: none; display: inline-block; margin: 0.2rem; font-size: 0.82rem; font-family: var(--font-sans); transition: background 0.2s; }
    .btn:hover { background: var(--wine-dark); }
    .btn-danger { background: #b91c1c; }
    .btn-danger:hover { background: #991b1b; }
    .btn-success { background: var(--wine); }
    .foto-preview { max-width: 100px; border-radius: var(--radius-sm); margin-top: 0.4rem; }
    .generos-checkboxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0.4rem; max-height: 260px; overflow-y: auto; padding: 0.6rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--warm-white); }
    .genero-item { position: relative; }
    .genero-item input[type=checkbox] { position: absolute; opacity: 0; width: 0; height: 0; }
    .genero-item label { display: block; padding: 0.4rem 0.7rem; background: var(--surface); border: 1px solid var(--border-light); border-radius: 20px; text-align: center; cursor: pointer; font-size: 0.82rem; font-weight: 500; transition: all 0.15s; text-transform: none; letter-spacing: 0; }
    .genero-item input:checked + label { background: var(--wine); color: white; border-color: var(--wine-dark); }
  </style>
</head>
<body>
<header class="m-header">
  <a class="m-logo" href="../admin-dashboard.html"><img src="/img/logo.png" alt="Museo de arte contemporáneo"></a>
  <nav class="m-nav">
    <span style="color:rgba(245,241,232,0.55);font-size:.83rem" id="userEmail"></span>
    <a href="../../index.html" class="btn-secondary">Ver sitio</a>
    <a class="btn-primary" style="cursor:pointer" onclick="logout()">Salir</a>
  </nav>
</header>
<div class="page-wrap">
  <a class="back-link" href="../admin-dashboard.html">Volver al panel</a>
  <h2>Gestión de artistas</h2>
  <button class="btn btn-success" onclick="mostrarFormulario()">Nuevo artista</button>
        <div id="formContainer" class="form-container hidden">
            <h3 id="formTitle">Nuevo artista</h3>
            <form id="artistaForm" enctype="multipart/form-data">
                <input type="hidden" id="artistaId" name="artistaId">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido">
                </div>
                <div class="form-group">
                    <label for="nacionalidad">Nacionalidad</label>
                    <input type="text" id="nacionalidad" name="nacionalidad" required placeholder="Ej: Italiana, Francesa">
                </div>
                <div class="form-group">
                    <label for="fecha_nacimiento">Fecha de Nacimiento</label>
                    <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
                </div>
                <div class="form-group">
                    <label for="biografia">Biografía</label>
                    <textarea id="biografia" name="biografia" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label for="foto">Foto del Artista</label>
                    <input type="file" id="foto" name="foto" accept="image/*">
                    <div id="fotoPreviewContainer">
                        <img id="fotoPreview" class="foto-preview" src="#" alt="Vista previa" style="display:none;">
                    </div>
                </div>
                <div class="form-group">
                    <label for="porcentaje_ganancia">% Ganancia</label>
                    <input type="number" id="porcentaje_ganancia" name="porcentaje_ganancia" step="0.1" min="0" max="100" value="5">
                </div>
                <div class="form-group">
                    <label>Géneros</label>
                    <div id="generosCheckboxes" class="generos-checkboxes"></div>
                </div>
                <button type="submit" class="btn btn-success">Guardar</button>
                <button type="button" class="btn btn-danger" onclick="cancelarFormulario()">Cancelar</button>
            </form>
        </div>
        <div id="artistasList">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Foto</th>
                        <th>Nombre</th>
                        <th>Nacionalidad</th>
                        <th>Géneros</th>
                        <th>% Ganancia</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaArtistas"></tbody>
            </table>
        </div>
    </div>
<footer class="m-footer"><span>&copy; 2026 Museo de arte contemporáneo</span>
  <a class="footer-github" href="https://github.com/LuisRojas260305/dev_BD_Museo/" target="_blank" aria-label="Repositorio en GitHub"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.74.08-.73.08-.73 1.21.09 1.85 1.24 1.85 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0 2.04.14 3 .4 2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.93.43.37.82 1.1.82 2.22v3.29c0 .32.22.7.83.58C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg></a></footer>

    <script src="../../../js/auth.js"></script>
    <script>
        // Gestión de Artistas - CRUD de artistas del museo.
        // API: /catalogo/artistas (GET, POST, PUT, DELETE), /catalogo/generos (GET).
        // auth.js (getUser, authFetch para autenticación).
        let generos = [];
        let editId = null;
        
        (function() {
            const user = getUser();
            if (!user || user.tipo !== 'administrador') {
                alert('Acceso no autorizado');
                window.location.href = '../../index.html';
            }
            document.getElementById('userEmail').innerText = user.email;
        })();

        
        async function cargarGeneros() {
            const res = await fetch(`${API_BASE}/catalogo/generos`);
            const result = await res.json();
            generos = result.data || [];
            const container = document.getElementById('generosCheckboxes');
            container.innerHTML = '';
            generos.forEach(g => {
                const div = document.createElement('div');
                div.className = 'genero-item';
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = g.nombre;
                cb.id = `gen_${g.nombre.replace(/\s+/g, '_')}`;
                const label = document.createElement('label');
                label.htmlFor = cb.id;
                label.textContent = g.nombre;
                div.appendChild(cb);
                div.appendChild(label);
                container.appendChild(div);
            });
        }

        
        async function cargarArtistas() {
            const res = await fetch(`${API_BASE}/catalogo/artistas`);
            const result = await res.json();
            const artistas = result.data || [];
            const tbody = document.getElementById('tablaArtistas');
            tbody.innerHTML = '';
            for (const a of artistas) {
                const nombreCompleto = a.nombre_completo || (a.nombre + ' ' + (a.apellido || ''));
                const fotoUrl = a.fotos && a.fotos.length > 0 ? a.fotos[0] : '';
                const generosStr = a.generos_artisticos ? (Array.isArray(a.generos_artisticos) ? a.generos_artisticos.join(', ') : a.generos_artisticos) : '';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><code>${String(a._id).substring(0, 8)}&hellip;</code></td>
                    <td><img src="${fotoUrl}" alt="foto" style="width:50px; height:50px; object-fit:cover;" onerror="this.style.display='none'"></td>
                    <td>${nombreCompleto}</td>
                    <td>${a.nacionalidad || ''}</td>
                    <td>${generosStr}</td>
                    <td>${a.porcentaje_ganancia}%</td>
                    <td>
                        <button class="btn" onclick='editarArtista("${a._id}")'>Editar</button>
                        <button class="btn btn-danger" onclick='eliminarArtista("${a._id}")'>Eliminar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            }
        }

        
        window.editarArtista = async function(id) {
            try {
                const res = await fetch(`${API_BASE}/catalogo/artistas/${id}`);
                const result = await res.json();
                if (!result.success) throw new Error(result.error || 'Error al cargar artista');
                const artista = result.data;
                
                document.getElementById('artistaId').value = artista._id;
                document.getElementById('nombre').value = artista.nombre || '';
                document.getElementById('apellido').value = artista.apellido || '';
                document.getElementById('nacionalidad').value = artista.nacionalidad || '';
                document.getElementById('fecha_nacimiento').value = artista.fecha_nacimiento ? artista.fecha_nacimiento.split('T')[0] : '';
                document.getElementById('biografia').value = artista.biografia || '';
                document.getElementById('porcentaje_ganancia').value = artista.porcentaje_ganancia;
                
                // Limpiar checkboxes
                const checkboxes = document.querySelectorAll('#generosCheckboxes input[type=checkbox]');
                checkboxes.forEach(cb => cb.checked = false);
                if (artista.generos_artisticos && Array.isArray(artista.generos_artisticos)) {
                    const nombres = artista.generos_artisticos.map(g => g.trim ? g.trim() : g);
                    checkboxes.forEach(cb => {
                        if (nombres.includes(cb.value)) cb.checked = true;
                    });
                }

                // Mostrar vista previa de la foto actual si existe
                const fotoPreview = document.getElementById('fotoPreview');
                const fotoUrl = artista.fotos && artista.fotos.length > 0 ? artista.fotos[0] : null;
                if (fotoUrl) {
                    fotoPreview.src = fotoUrl;
                    fotoPreview.style.display = 'block';
                } else {
                    fotoPreview.style.display = 'none';
                }

                document.getElementById('formTitle').innerText = 'Editar Artista';
                document.getElementById('formContainer').classList.remove('hidden');
                editId = id;
            } catch (error) {
                alert('Error al cargar artista: ' + error.message);
            }
        };

        
        window.eliminarArtista = async function(id) {
            if (!confirm('¿Eliminar artista?')) return;
            try {
                const res = await authFetch(`${API_BASE}/catalogo/artistas/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    alert('Artista eliminado');
                    cargarArtistas();
                } else {
                    const err = await res.json();
                    alert('Error: ' + err.error);
                }
            } catch (error) {
                alert('Error de conexión');
            }
        };

        
        document.getElementById('artistaForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('nombre', document.getElementById('nombre').value);
            formData.append('apellido', document.getElementById('apellido').value || '');
            formData.append('nacionalidad', document.getElementById('nacionalidad').value);
            formData.append('fecha_nacimiento', document.getElementById('fecha_nacimiento').value || '');
            formData.append('biografia', document.getElementById('biografia').value || '');
            formData.append('porcentaje_ganancia', document.getElementById('porcentaje_ganancia').value);
            
            const fotoInput = document.getElementById('foto');
            if (fotoInput.files.length > 0) {
                formData.append('foto', fotoInput.files[0]);
            }
            
            const selectedGeneros = [];
            document.querySelectorAll('#generosCheckboxes input[type=checkbox]:checked')
                .forEach(cb => selectedGeneros.push(cb.value));
            formData.append('generos_artisticos', JSON.stringify(selectedGeneros));

            try {
                let url = `${API_BASE}/catalogo/artistas`;
                let method = 'POST';
                if (editId) {
                    url += `/${editId}`;
                    method = 'PUT';
                }
                const res = await authFetch(url, { 
                    method, 
                    body: formData 
                });
                if (res.ok) {
                    alert('Artista guardado');
                    cancelarFormulario();
                    cargarArtistas();
                } else {
                    const err = await res.json();
                    alert('Error: ' + err.error);
                }
            } catch (error) {
                alert('Error de conexión');
            }
        });

        
        function mostrarFormulario() {
            document.getElementById('formContainer').classList.remove('hidden');
            document.getElementById('artistaForm').reset();
            document.getElementById('artistaId').value = '';
            document.getElementById('formTitle').innerText = 'Nuevo artista';
            document.getElementById('fotoPreview').style.display = 'none';
            // Desmarcar checkboxes
            document.querySelectorAll('#generosCheckboxes input[type=checkbox]')
                .forEach(cb => cb.checked = false);
            editId = null;
        }

        
        function cancelarFormulario() {
            document.getElementById('formContainer').classList.add('hidden');
        }

        
        document.getElementById('foto').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const fotoPreview = document.getElementById('fotoPreview');
                    fotoPreview.src = event.target.result;
                    fotoPreview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                document.getElementById('fotoPreview').style.display = 'none';
            }
        });

        // Inicializar: cargar géneros disponibles y luego la tabla de artistas.
        cargarGeneros().then(() => cargarArtistas());
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Gestión de Obras</title>
  <link rel="stylesheet" href="/css/museo.css">
  <style>
    .page-wrap { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
    h2 { font-family: var(--font-serif); font-size: 1.35rem; font-weight: 400; color: var(--text); margin-bottom: 1.2rem; }
    h4 { color: var(--text); font-weight: 500; margin: 0.8rem 0 0.4rem; font-size: 0.9rem; }
    small { color: var(--text-light); font-size: 0.78rem; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow); }
    th, td { padding: 0.8rem 1rem; text-align: left; border-bottom: 1px solid var(--border-light); font-size: 0.88rem; }
    th { background: var(--text); color: rgba(245,241,232,0.85); font-weight: 500; font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; }
    td { color: var(--text-muted); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--warm-white); }
    .form-container { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; animation: fadeUp 0.3s ease; }
    .form-container h3 { font-family: var(--font-serif); font-size: 1.05rem; font-weight: 500; margin-bottom: 1rem; color: var(--text); }
    .hidden { display: none; }
    .form-group { margin-bottom: 0.9rem; }
    label { display: block; margin-bottom: 0.3rem; font-size: 0.82rem; font-weight: 500; color: var(--text-muted); }
    input:not([type=file]):not([type=checkbox]), select, textarea { width: 100%; padding: 0.5rem 0.7rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.88rem; font-family: var(--font-sans); color: var(--text); background: var(--cream); box-sizing: border-box; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--wine); }
    .btn { background: var(--wine); color: white; border: none; padding: 0.45rem 0.9rem; border-radius: var(--radius-sm); cursor: pointer; text-decoration: none; display: inline-block; margin: 0.2rem; font-size: 0.82rem; font-family: var(--font-sans); transition: background 0.2s; }
    .btn:hover { background: var(--wine-dark); }
    .btn-danger { background: #b91c1c; }
    .btn-danger:hover { background: #991b1b; }
    .btn-success { background: var(--wine); }
    .thumbnail { width: 44px; height: 44px; object-fit: cover; border-radius: var(--radius-sm); }
    .preview-image { max-width: 180px; border-radius: var(--radius-sm); margin-top: 0.5rem; }
    .readonly-input { background: var(--beige) !important; cursor: not-allowed !important; }
    .checkbox-group { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0.4rem; max-height: 260px; overflow-y: auto; padding: 0.6rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--warm-white); }
    .checkbox-item { position: relative; }
    .checkbox-item input[type=checkbox] { position: absolute; opacity: 0; width: 0; height: 0; }
    .checkbox-item label { display: block; padding: 0.4rem 0.7rem; background: var(--surface); border: 1px solid var(--border-light); border-radius: 20px; text-align: center; cursor: pointer; font-size: 0.82rem; font-weight: 500; transition: all 0.15s; text-transform: none; letter-spacing: 0; }
    .checkbox-item input:checked + label { background: var(--wine); color: white; border-color: var(--wine-dark); }
  </style>
</head>
<body>
<header class="m-header">
  <a class="m-logo" href="../admin-dashboard.html"><img src="/img/logo.png" alt="Museo de arte contemporáneo"></a>
  <nav class="m-nav">
    <span style="color:rgba(245,241,232,0.55);font-size:.83rem" id="userEmail"></span>
    <a href="../../index.html" class="btn-secondary">Ver sitio</a>
    <a class="btn-primary" style="cursor:pointer" onclick="logout()">Salir</a>
  </nav>
</header>
<div class="page-wrap">
  <a class="back-link" href="../admin-dashboard.html">Volver al panel</a>
  <h2>Gestión de obras</h2>
  <button class="btn btn-success" onclick="mostrarFormulario()">Nueva obra</button>
        <div id="formContainer" class="form-container hidden">
            <h3 id="formTitle">Nueva obra</h3>
            <form id="obraForm">
                <input type="hidden" id="obraId">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label for="codigo_inventario">Código de Inventario</label>
                    <input type="text" id="codigo_inventario" required readonly class="readonly-input">
                    <small>Se genera automáticamente al seleccionar el género</small>
                </div>
                <div class="form-group">
                    <label for="artista_id">Artista</label>
                    <select id="artista_id" required></select>
                </div>
                <div class="form-group">
                    <label for="genero_id">Género</label>
                    <select id="genero_id" required onchange="onGeneroChange()"></select>
                </div>
                <div class="form-group">
                    <label for="epoca_nombre">Época</label>
                    <input type="text" id="epoca_nombre" required placeholder="Ej: Renacimiento, Barroco">
                </div>
                <div class="form-group">
                    <label for="precio_venta">Precio de Venta</label>
                    <input type="number" id="precio_venta" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="fecha_creacion">Fecha de Creación</label>
                    <input type="date" id="fecha_creacion" required>
                </div>
                <div class="form-group">
                    <label for="alto">Alto (cm)</label>
                    <input type="number" id="alto" step="0.01" value="0">
                </div>
                <div class="form-group">
                    <label for="ancho">Ancho (cm)</label>
                    <input type="number" id="ancho" step="0.01" value="0">
                </div>
                <div class="form-group">
                    <label for="imagen">Imagen de la obra</label>
                    <input type="file" id="imagenFile" name="foto" accept="image/*">
                    <div id="previewContainer"></div>
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" rows="3"></textarea>
                </div>
                <div id="camposEspecificos"></div>
                <button type="submit" class="btn btn-success">Guardar</button>
                <button type="button" class="btn btn-danger" onclick="cancelarFormulario()">Cancelar</button>
            </form>
        </div>
        <div id="obrasList">
            <table>
                <thead><tr><th>ID</th><th>Imagen</th><th>Nombre</th><th>Artista</th><th>Género</th><th>Precio</th><th>Estado</th><th>Acciones</th></tr></thead>
                <tbody id="tablaObras"></tbody>
            </table>
        </div>
    </div>
<footer class="m-footer"><span>&copy; 2026 Museo de arte contemporáneo</span>
  <a class="footer-github" href="https://github.com/LuisRojas260305/dev_BD_Museo/" target="_blank" aria-label="Repositorio en GitHub"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.74.08-.73.08-.73 1.21.09 1.85 1.24 1.85 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0 2.04.14 3 .4 2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.93.43.37.82 1.1.82 2.22v3.29c0 .32.22.7.83.58C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg></a></footer>

    <script src="../../../js/auth.js"></script>
    <script>
        // Gestión de Obras - CRUD completo de obras artísticas con campos dinámicos según género.
        // API: /catalogo (GET), /catalogo/obras (POST, PUT, DELETE), /catalogo/artistas (GET),
        //      /catalogo/generos (GET), /catalogo/{id} (GET para editar).
        // auth.js (getUser, authFetch para autenticación).
        let artistas = [], generos = [];
        let editId = null;
        let currentEstado = null; // Para guardar el estado al editar

        const generoPrefijo = {
            'Pintura':     'PIN',
            'Escultura':   'ESC',
            'Fotografía':  'FOT',
            'Cerámica':    'CER',
            'Orfebrería':  'ORF',
            'Cristalería': 'CRIS',
            'Textil':      'TEXT',
            'Grabado':     'GRAB',
            'Acuarela':    'ACUA',
        };

        (function() {
            const user = getUser();
            
            if (!user || user.tipo !== 'administrador') {
                alert('Acceso no autorizado');
                window.location.href = '../../index.html';
            }
                
            document.getElementById('userEmail').innerText = user.email;
        })();

        
        function generarCodigoInventario(genero) {
            if (!genero || !generoPrefijo[genero]) return '';
            const prefijo = generoPrefijo[genero];
            const numero = Math.floor(Math.random() * 100000).toString().padStart(5, '0');
            return `${prefijo}-${numero}`;
        }

        
        function onGeneroChange() {
            const genero = document.getElementById('genero_id').value;
            if (genero && !editId) {
                document.getElementById('codigo_inventario').value = generarCodigoInventario(genero);
            }
            cargarCamposPorGenero();
        }

        
        async function cargarArtistas() {
            const res = await fetch(`${API_BASE}/catalogo/artistas`);
            const result = await res.json();
            artistas = result.data || [];
            llenarSelect('artista_id', artistas, '_id', a => `${a.nombre} ${a.apellido || ''}`.trim());
        }

        
        async function cargarGeneros() {
            const res = await fetch(`${API_BASE}/catalogo/generos`);
            const result = await res.json();
            generos = result.data || [];
            llenarSelect('genero_id', generos, 'nombre', 'nombre');
        }

        
        function llenarSelect(id, items, valueKey, textKey) {
            const select = document.getElementById(id);
            select.innerHTML = '<option value="">Seleccione</option>';
            items.forEach(item => {
                const option = document.createElement('option');
                option.value = item[valueKey];
                option.textContent = typeof textKey === 'function' ? textKey(item) : item[textKey];
                select.appendChild(option);
            });
        }

        // Inicializar: cargar artistas y géneros, luego la tabla de obras.
        Promise.all([
            cargarArtistas(),
            cargarGeneros()
        ]).then(() => {
            cargarObras();
        });

        
        function cargarCamposPorGenero() {
            const genero = document.getElementById('genero_id').value;
            const contenedor = document.getElementById('camposEspecificos');
            contenedor.innerHTML = '';

            if (!genero) return;

            switch (genero) {
                case 'Pintura':
                    contenedor.innerHTML = `
                        <h4>Campos de Pintura</h4>
                        <div class="form-group">
                            <label for="detalle_soporte">Soporte</label>
                            <input type="text" id="detalle_soporte" required placeholder="Ej: Lienzo, Madera">
                        </div>
                        <div class="form-group">
                            <label for="detalle_estilos">Estilos (separados por coma)</label>
                            <input type="text" id="detalle_estilos" placeholder="Ej: Renacentista, Barroco">
                        </div>
                        <div class="form-group">
                            <label for="detalle_tematicas">Temáticas (separadas por coma)</label>
                            <input type="text" id="detalle_tematicas" placeholder="Ej: Religioso, Retrato">
                        </div>
                    `;
                    break;
                case 'Escultura':
                    contenedor.innerHTML = `
                        <h4>Campos de Escultura</h4>
                        <div class="form-group">
                            <label for="detalle_tipo_escultura">Tipo de Escultura</label>
                            <input type="text" id="detalle_tipo_escultura" required placeholder="Ej: Bajorrelieve, Bulto redondo">
                        </div>
                        <div class="form-group">
                            <label for="peso_escultura">Peso (kg)</label>
                            <input type="number" id="peso_escultura" step="0.01" value="0">
                        </div>
                        <div class="form-group">
                            <label for="profundidad_escultura">Profundidad (cm)</label>
                            <input type="number" id="profundidad_escultura" step="0.01" value="0">
                        </div>
                        <div class="form-group">
                            <label for="detalle_materiales">Materiales (separados por coma)</label>
                            <input type="text" id="detalle_materiales" placeholder="Ej: Mármol, Bronce">
                        </div>
                        <div class="form-group">
                            <label for="detalle_tecnicas">Técnicas (separadas por coma)</label>
                            <input type="text" id="detalle_tecnicas" placeholder="Ej: Talla, Fundición">
                        </div>
                    `;
                    break;
                case 'Fotografía':
                    contenedor.innerHTML = `
                        <h4>Campos de Fotografía</h4>
                        <div class="form-group">
                            <label for="tiraje">Tiraje</label>
                            <input type="number" id="tiraje" value="1" min="1">
                        </div>
                        <div class="form-group">
                            <label for="obturacion">Obturación</label>
                            <input type="text" id="obturacion" required placeholder="Ej: 1/250">
                        </div>
                        <div class="form-group">
                            <label for="apertura">Apertura</label>
                            <input type="text" id="apertura" required placeholder="Ej: f/2.8">
                        </div>
                        <div class="form-group">
                            <label for="iso">ISO</label>
                            <input type="number" id="iso" required>
                        </div>
                        <div class="form-group">
                            <label for="resolucion">Resolución</label>
                            <input type="text" id="resolucion" required placeholder="Ej: 300dpi">
                        </div>
                        <div class="form-group">
                            <label for="fecha_captura">Fecha de Captura</label>
                            <input type="date" id="fecha_captura" required>
                        </div>
                        <div class="form-group">
                            <label for="detalle_impresion">Impresión</label>
                            <input type="text" id="detalle_impresion" required placeholder="Ej: Gelatina de plata">
                        </div>
                        <div class="form-group">
                            <label for="detalle_camara">Cámara</label>
                            <input type="text" id="detalle_camara" required placeholder="Ej: Leica M3">
                        </div>
                        <div class="form-group">
                            <label for="detalle_tecnica_fotografica">Técnica fotográfica</label>
                            <input type="text" id="detalle_tecnica_fotografica" required placeholder="Ej: Blanco y negro">
                        </div>
                    `;
                    break;
                case 'Cerámica':
                    contenedor.innerHTML = `
                        <h4>Campos de Cerámica</h4>
                        <div class="form-group">
                            <label for="profundidad_ceramica">Profundidad (cm)</label>
                            <input type="number" id="profundidad_ceramica" step="0.01" value="0">
                        </div>
                        <div class="form-group">
                            <label for="diametro">Diámetro (cm)</label>
                            <input type="number" id="diametro" step="0.01" value="0">
                        </div>
                        <div class="form-group">
                            <label for="funcionalidad">Funcionalidad</label>
                            <input type="text" id="funcionalidad" value="Desconocido">
                        </div>
                        <div class="form-group">
                            <label for="detalle_coccion">Cocción</label>
                            <input type="text" id="detalle_coccion" required placeholder="Ej: Oxidación">
                        </div>
                        <div class="form-group">
                            <label for="detalle_arcilla">Arcilla</label>
                            <input type="text" id="detalle_arcilla" required placeholder="Ej: Terracota">
                        </div>
                        <div class="form-group">
                            <label for="detalle_modelado">Modelado</label>
                            <input type="text" id="detalle_modelado" required placeholder="Ej: Torno">
                        </div>
                        <div class="form-group">
                            <label for="detalle_esmaltado">Esmaltado</label>
                            <input type="text" id="detalle_esmaltado" required placeholder="Ej: Estaño">
                        </div>
                    `;
                    break;
                case 'Orfebrería':
                    contenedor.innerHTML = `
                        <h4>Campos de Orfebrería</h4>
                        <div class="form-group">
                            <label for="profundidad_orfebreria">Profundidad (cm)</label>
                            <input type="number" id="profundidad_orfebreria" step="0.01" value="0">
                        </div>
                        <div class="form-group">
                            <label for="diametro_orfebreria">Diámetro (cm)</label>
                            <input type="number" id="diametro_orfebreria" step="0.01" value="0">
                        </div>
                        <div class="form-group">
                            <label for="peso_orfebreria">Peso (kg)</label>
                            <input type="number" id="peso_orfebreria" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="detalle_pieza">Pieza</label>
                            <input type="text" id="detalle_pieza" required placeholder="Ej: Copón, Cáliz">
                        </div>
                        <div class="form-group">
                            <label for="detalle_metal_predominante">Metal predominante</label>
                            <input type="text" id="detalle_metal_predominante" required placeholder="Ej: Oro">
                        </div>
                        <div class="form-group">
                            <label for="detalle_metales">Otros Metales (separados por coma)</label>
                            <input type="text" id="detalle_metales" placeholder="Ej: Plata, Cobre">
                        </div>
                    `;
                    break;
                case 'Cristalería':
                    contenedor.innerHTML = `
                        <h4>Campos de Cristalería</h4>
                        <div class="form-group">
                            <label for="detalle_tipo_vidrio">Tipo de vidrio</label>
                            <input type="text" id="detalle_tipo_vidrio" placeholder="Ej: Soplado, Camafeo, Opalescente">
                        </div>
                        <div class="form-group">
                            <label for="detalle_tecnica_cristal">Técnica</label>
                            <input type="text" id="detalle_tecnica_cristal" placeholder="Ej: Soplado a boca, Grabado al ácido">
                        </div>
                        <div class="form-group">
                            <label for="detalle_transparencia">Transparencia</label>
                            <input type="text" id="detalle_transparencia" placeholder="Ej: Transparente, Translúcido, Opaco">
                        </div>
                        <div class="form-group">
                            <label for="detalle_color_cristal">Color</label>
                            <input type="text" id="detalle_color_cristal" placeholder="Ej: Azul cobalto">
                        </div>
                        <div class="form-group">
                            <label for="diametro_cristal">Diámetro (cm)</label>
                            <input type="number" id="diametro_cristal" step="0.01" value="0">
                        </div>
                        <div class="form-group">
                            <label for="peso_cristal">Peso (kg)</label>
                            <input type="number" id="peso_cristal" step="0.01" value="0">
                        </div>
                    `;
                    break;
                case 'Textil':
                    contenedor.innerHTML = `
                        <h4>Campos de Textil</h4>
                        <div class="form-group">
                            <label for="detalle_tipo_tejido">Tipo de tejido</label>
                            <input type="text" id="detalle_tipo_tejido" placeholder="Ej: Tapiz, Bordado, Macramé">
                        </div>
                        <div class="form-group">
                            <label for="detalle_fibra">Fibras (separadas por coma)</label>
                            <input type="text" id="detalle_fibra" placeholder="Ej: Lana, Seda, Algodón">
                        </div>
                        <div class="form-group">
                            <label for="detalle_tecnica_textil">Técnica</label>
                            <input type="text" id="detalle_tecnica_textil" placeholder="Ej: Tapicería, Jacquard">
                        </div>
                        <div class="form-group">
                            <label for="detalle_urdimbre">Urdimbre</label>
                            <input type="text" id="detalle_urdimbre" placeholder="Ej: Algodón crudo">
                        </div>
                        <div class="form-group">
                            <label for="detalle_trama">Trama</label>
                            <input type="text" id="detalle_trama" placeholder="Ej: Lana teñida">
                        </div>
                    `;
                    break;
                case 'Grabado':
                    contenedor.innerHTML = `
                        <h4>Campos de Grabado</h4>
                        <div class="form-group">
                            <label for="detalle_soporte_grabado">Soporte</label>
                            <input type="text" id="detalle_soporte_grabado" placeholder="Ej: Papel verjurado, Papel japonés">
                        </div>
                        <div class="form-group">
                            <label for="detalle_tecnica_grabado">Técnica de grabado</label>
                            <input type="text" id="detalle_tecnica_grabado" placeholder="Ej: Aguafuerte, Litografía, Xilografía">
                        </div>
                        <div class="form-group">
                            <label for="detalle_tiraje_grabado">Tiraje</label>
                            <input type="number" id="detalle_tiraje_grabado" min="1" value="1">
                        </div>
                        <div class="form-group">
                            <label for="detalle_num_edicion">Número de edición</label>
                            <input type="text" id="detalle_num_edicion" placeholder="Ej: 5/50">
                        </div>
                        <div class="form-group">
                            <label for="detalle_tinta">Tinta</label>
                            <input type="text" id="detalle_tinta" placeholder="Ej: Tinta negra de imprenta">
                        </div>
                    `;
                    break;
                case 'Acuarela':
                    contenedor.innerHTML = `
                        <h4>Campos de Acuarela</h4>
                        <div class="form-group">
                            <label for="detalle_soporte_acuarela">Soporte</label>
                            <input type="text" id="detalle_soporte_acuarela" placeholder="Ej: Papel de algodón 300g">
                        </div>
                        <div class="form-group">
                            <label for="detalle_tecnica_acuarela">Técnica</label>
                            <input type="text" id="detalle_tecnica_acuarela" placeholder="Ej: Húmedo sobre húmedo, Seco sobre seco">
                        </div>
                        <div class="form-group">
                            <label for="detalle_estilos_acuarela">Estilos (separados por coma)</label>
                            <input type="text" id="detalle_estilos_acuarela" placeholder="Ej: Impresionismo, Realismo">
                        </div>
                        <div class="form-group">
                            <label for="detalle_tematicas_acuarela">Temáticas (separadas por coma)</label>
                            <input type="text" id="detalle_tematicas_acuarela" placeholder="Ej: Paisaje, Marina">
                        </div>
                    `;
                    break;
            }
        }

        // Vista previa de la imagen seleccionada
        document.getElementById('imagenFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const preview = document.getElementById('previewContainer');
                    preview.innerHTML = `<img src="${event.target.result}" class="preview-image">`;
                };
                reader.readAsDataURL(file);
            } else {
                document.getElementById('previewContainer').innerHTML = '';
            }
        });

        
        function extraerPrecio(precio) {
            if (!precio) return '0.00';
            if (typeof precio === 'object' && precio.$numberDecimal) return precio.$numberDecimal;
            if (typeof precio === 'number') return precio.toString();
            return precio;
        }

        
        function obtenerNombreArtista(artista) {
            if (!artista) return 'Desconocido';
            if (typeof artista === 'string') return artista;
            const nombre = artista.nombre_completo || `${artista.nombre || ''} ${artista.apellido || ''}`.trim();
            return nombre || 'Desconocido';
        }

        
        function obtenerFotoThumbnail(fotos) {
            if (!fotos || !Array.isArray(fotos) || fotos.length === 0) return '';
            return fotos[0];
        }

        
        async function cargarObras() {
            const res = await fetch(`${API_BASE}/catalogo`);
            const result = await res.json();
            const obras = result.data || [];
            const tbody = document.getElementById('tablaObras');
            tbody.innerHTML = '';
            obras.forEach(o => {
                const tr = document.createElement('tr');
                const precio = extraerPrecio(o.precio_venta);
                const artistaNombre = obtenerNombreArtista(o.artista);
                const fotoUrl = obtenerFotoThumbnail(o.fotos);
                tr.innerHTML = `
                    <td>${o._id}</td>
                    <td>${fotoUrl ? `<img src="${fotoUrl}" alt="foto" class="thumbnail" onerror="this.style.display='none'">` : ''}</td>
                    <td>${o.nombre}</td>
                    <td>${artistaNombre}</td>
                    <td>${o.genero || ''}</td>
                    <td>$${precio}</td>
                    <td>${o.estado || ''}</td>
                    <td>
                        <button class="btn" onclick='editarObra("${o._id}")'>Editar</button>
                        <button class="btn btn-danger" onclick='eliminarObra("${o._id}")'>Eliminar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        
        window.editarObra = async function(id) {
            try {
                const res = await fetch(`${API_BASE}/catalogo/${id}`);
                const result = await res.json();
                if (!res.ok) throw new Error(result.error);
                const obra = result.data || result;
                
                document.getElementById('obraId').value = obra._id;
                document.getElementById('nombre').value = obra.nombre || '';
                document.getElementById('codigo_inventario').value = obra.codigo_inventario || '';
                // Artista: el objeto artista puede venir con _id o ser un ID directo
                if (obra.artista && obra.artista._id) {
                    document.getElementById('artista_id').value = obra.artista._id;
                } else if (obra.artista_id) {
                    document.getElementById('artista_id').value = obra.artista_id;
                }
                document.getElementById('genero_id').value = obra.genero || '';
                document.getElementById('epoca_nombre').value = (obra.epoca && obra.epoca.nombre) || obra.epoca || '';
                const precio = extraerPrecio(obra.precio_venta);
                document.getElementById('precio_venta').value = precio;
                if (obra.fecha_creacion) {
                    document.getElementById('fecha_creacion').value = obra.fecha_creacion.split('T')[0];
                }
                document.getElementById('alto').value = obra.alto || 0;
                document.getElementById('ancho').value = obra.ancho || 0;
                document.getElementById('descripcion').value = obra.descripcion || '';
                currentEstado = obra.estado; // Guardar estado actual

                // Cargar campos específicos según género
                cargarCamposPorGenero();

                // Llenar campos específicos después de que se hayan creado
                setTimeout(() => {
                    const d = obra.detalles || {};
                    const genero = obra.genero || '';
                    if (genero === 'Pintura') {
                        if (d.soporte) document.getElementById('detalle_soporte').value = d.soporte;
                        if (d.estilos && Array.isArray(d.estilos)) {
                            document.getElementById('detalle_estilos').value = d.estilos.join(', ');
                        }
                        if (d.tematicas && Array.isArray(d.tematicas)) {
                            document.getElementById('detalle_tematicas').value = d.tematicas.join(', ');
                        }
                    } else if (genero === 'Escultura') {
                        if (d.tipo_escultura) document.getElementById('detalle_tipo_escultura').value = d.tipo_escultura;
                        if (d.peso) document.getElementById('peso_escultura').value = d.peso;
                        if (d.profundidad) document.getElementById('profundidad_escultura').value = d.profundidad;
                        if (d.materiales && Array.isArray(d.materiales)) {
                            document.getElementById('detalle_materiales').value = d.materiales.join(', ');
                        }
                        if (d.tecnicas && Array.isArray(d.tecnicas)) {
                            document.getElementById('detalle_tecnicas').value = d.tecnicas.join(', ');
                        }
                    } else if (genero === 'Fotografía') {
                        if (d.tiraje) document.getElementById('tiraje').value = d.tiraje;
                        if (d.obturacion) document.getElementById('obturacion').value = d.obturacion;
                        if (d.apertura) document.getElementById('apertura').value = d.apertura;
                        if (d.iso) document.getElementById('iso').value = d.iso;
                        if (d.resolucion) document.getElementById('resolucion').value = d.resolucion;
                        if (d.fecha_captura) document.getElementById('fecha_captura').value = d.fecha_captura.split('T')[0];
                        if (d.impresion) document.getElementById('detalle_impresion').value = d.impresion;
                        if (d.camara) document.getElementById('detalle_camara').value = d.camara;
                        if (d.tecnica_fotografica) document.getElementById('detalle_tecnica_fotografica').value = d.tecnica_fotografica;
                    } else if (genero === 'Cerámica') {
                        if (d.profundidad) document.getElementById('profundidad_ceramica').value = d.profundidad;
                        if (d.diametro) document.getElementById('diametro').value = d.diametro;
                        if (d.funcionalidad) document.getElementById('funcionalidad').value = d.funcionalidad;
                        if (d.coccion) document.getElementById('detalle_coccion').value = d.coccion;
                        if (d.arcilla) document.getElementById('detalle_arcilla').value = d.arcilla;
                        if (d.modelado) document.getElementById('detalle_modelado').value = d.modelado;
                        if (d.esmaltado) document.getElementById('detalle_esmaltado').value = d.esmaltado;
                    } else if (genero === 'Orfebrería') {
                        if (d.profundidad) document.getElementById('profundidad_orfebreria').value = d.profundidad;
                        if (d.diametro) document.getElementById('diametro_orfebreria').value = d.diametro;
                        if (d.peso) document.getElementById('peso_orfebreria').value = d.peso;
                        if (d.pieza) document.getElementById('detalle_pieza').value = d.pieza;
                        if (d.metal_predominante) document.getElementById('detalle_metal_predominante').value = d.metal_predominante;
                        if (d.metales && Array.isArray(d.metales)) {
                            document.getElementById('detalle_metales').value = d.metales.join(', ');
                        }
                    } else if (genero === 'Cristalería') {
                        if (d.tipo_vidrio) document.getElementById('detalle_tipo_vidrio').value = d.tipo_vidrio;
                        if (d.tecnica) document.getElementById('detalle_tecnica_cristal').value = d.tecnica;
                        if (d.transparencia) document.getElementById('detalle_transparencia').value = d.transparencia;
                        if (d.color) document.getElementById('detalle_color_cristal').value = d.color;
                        if (d.diametro) document.getElementById('diametro_cristal').value = d.diametro;
                        if (d.peso) document.getElementById('peso_cristal').value = d.peso;
                    } else if (genero === 'Textil') {
                        if (d.tipo_tejido) document.getElementById('detalle_tipo_tejido').value = d.tipo_tejido;
                        if (d.fibra && Array.isArray(d.fibra)) document.getElementById('detalle_fibra').value = d.fibra.join(', ');
                        if (d.tecnica) document.getElementById('detalle_tecnica_textil').value = d.tecnica;
                        if (d.urdimbre) document.getElementById('detalle_urdimbre').value = d.urdimbre;
                        if (d.trama) document.getElementById('detalle_trama').value = d.trama;
                    } else if (genero === 'Grabado') {
                        if (d.soporte) document.getElementById('detalle_soporte_grabado').value = d.soporte;
                        if (d.tecnica_grabado) document.getElementById('detalle_tecnica_grabado').value = d.tecnica_grabado;
                        if (d.tiraje) document.getElementById('detalle_tiraje_grabado').value = d.tiraje;
                        if (d.num_edicion) document.getElementById('detalle_num_edicion').value = d.num_edicion;
                        if (d.tinta) document.getElementById('detalle_tinta').value = d.tinta;
                    } else if (genero === 'Acuarela') {
                        if (d.soporte) document.getElementById('detalle_soporte_acuarela').value = d.soporte;
                        if (d.tecnica) document.getElementById('detalle_tecnica_acuarela').value = d.tecnica;
                        if (d.estilos && Array.isArray(d.estilos)) document.getElementById('detalle_estilos_acuarela').value = d.estilos.join(', ');
                        if (d.tematicas && Array.isArray(d.tematicas)) document.getElementById('detalle_tematicas_acuarela').value = d.tematicas.join(', ');
                    }
                }, 100);

                // Mostrar vista previa de la foto desde fotos[0]
                const fotoUrl = obtenerFotoThumbnail(obra.fotos);
                if (fotoUrl) {
                    document.getElementById('previewContainer').innerHTML = `<img src="${fotoUrl}" class="preview-image">`;
                } else {
                    document.getElementById('previewContainer').innerHTML = '';
                }

                document.getElementById('formTitle').innerText = 'Editar Obra';
                document.getElementById('formContainer').classList.remove('hidden');
                editId = id;
            } catch (error) {
                alert('Error al cargar obra: ' + error.message);
            }
        };

        
        window.eliminarObra = async function(id) {
            if (!confirm('¿Eliminar obra?')) return;
            try {
                const res = await authFetch(`${API_BASE}/catalogo/obras/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    alert('Obra eliminada');
                    cargarObras();
                } else {
                    const err = await res.json();
                    alert('Error: ' + err.error);
                }
            } catch (error) {
                alert('Error de conexión');
            }
        };

        
        function splitPorComa(valor) {
            if (!valor || !valor.trim()) return [];
            return valor.split(',').map(s => s.trim()).filter(s => s.length > 0);
        }

        
        document.getElementById('obraForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            // Datos comunes - formato MongoDB
            formData.append('nombre', document.getElementById('nombre').value);
            formData.append('codigo_inventario', document.getElementById('codigo_inventario').value);
            formData.append('artista_id', document.getElementById('artista_id').value);
            formData.append('genero', document.getElementById('genero_id').value);
            formData.append('epoca[nombre]', document.getElementById('epoca_nombre').value);
            formData.append('precio_venta', document.getElementById('precio_venta').value);
            formData.append('fecha_creacion', document.getElementById('fecha_creacion').value);
            formData.append('alto', document.getElementById('alto').value);
            formData.append('ancho', document.getElementById('ancho').value);
            formData.append('descripcion', document.getElementById('descripcion').value || '');

            // Estado según sea creación o edición
            if (editId) {
                formData.append('estado', currentEstado || 'Disponible');
            } else {
                formData.append('estado', 'Disponible');
            }

            // Agregar imagen si se seleccionó
            const imagenFile = document.getElementById('imagenFile').files[0];
            if (imagenFile) {
                formData.append('foto', imagenFile);
            }

            const genero = document.getElementById('genero_id').value;

            // Datos específicos según género - formato MongoDB (detalles.xxx)
            switch (genero) {
                case 'Pintura':
                    formData.append('detalles[soporte]', document.getElementById('detalle_soporte').value);
                    formData.append('detalles[estilos]', JSON.stringify(splitPorComa(document.getElementById('detalle_estilos').value)));
                    formData.append('detalles[tematicas]', JSON.stringify(splitPorComa(document.getElementById('detalle_tematicas').value)));
                    break;
                case 'Escultura':
                    formData.append('detalles[tipo_escultura]', document.getElementById('detalle_tipo_escultura').value);
                    formData.append('detalles[peso]', document.getElementById('peso_escultura').value);
                    formData.append('detalles[profundidad]', document.getElementById('profundidad_escultura').value);
                    formData.append('detalles[materiales]', JSON.stringify(splitPorComa(document.getElementById('detalle_materiales').value)));
                    formData.append('detalles[tecnicas]', JSON.stringify(splitPorComa(document.getElementById('detalle_tecnicas').value)));
                    break;
                case 'Fotografía':
                    formData.append('detalles[tiraje]', document.getElementById('tiraje').value);
                    formData.append('detalles[obturacion]', document.getElementById('obturacion').value);
                    formData.append('detalles[apertura]', document.getElementById('apertura').value);
                    formData.append('detalles[iso]', document.getElementById('iso').value);
                    formData.append('detalles[resolucion]', document.getElementById('resolucion').value);
                    formData.append('detalles[fecha_captura]', document.getElementById('fecha_captura').value);
                    formData.append('detalles[impresion]', document.getElementById('detalle_impresion').value);
                    formData.append('detalles[camara]', document.getElementById('detalle_camara').value);
                    formData.append('detalles[tecnica_fotografica]', document.getElementById('detalle_tecnica_fotografica').value);
                    break;
                case 'Cerámica':
                    formData.append('detalles[profundidad]', document.getElementById('profundidad_ceramica').value);
                    formData.append('detalles[diametro]', document.getElementById('diametro').value);
                    formData.append('detalles[funcionalidad]', document.getElementById('funcionalidad').value);
                    formData.append('detalles[coccion]', document.getElementById('detalle_coccion').value);
                    formData.append('detalles[arcilla]', document.getElementById('detalle_arcilla').value);
                    formData.append('detalles[modelado]', document.getElementById('detalle_modelado').value);
                    formData.append('detalles[esmaltado]', document.getElementById('detalle_esmaltado').value);
                    break;
                case 'Orfebrería':
                    formData.append('detalles[profundidad]', document.getElementById('profundidad_orfebreria').value);
                    formData.append('detalles[diametro]', document.getElementById('diametro_orfebreria').value);
                    formData.append('detalles[peso]', document.getElementById('peso_orfebreria').value);
                    formData.append('detalles[pieza]', document.getElementById('detalle_pieza').value);
                    formData.append('detalles[metal_predominante]', document.getElementById('detalle_metal_predominante').value);
                    formData.append('detalles[metales]', JSON.stringify(splitPorComa(document.getElementById('detalle_metales').value)));
                    break;
                case 'Cristalería':
                    formData.append('detalles[tipo_vidrio]', document.getElementById('detalle_tipo_vidrio').value);
                    formData.append('detalles[tecnica]', document.getElementById('detalle_tecnica_cristal').value);
                    formData.append('detalles[transparencia]', document.getElementById('detalle_transparencia').value);
                    formData.append('detalles[color]', document.getElementById('detalle_color_cristal').value);
                    formData.append('detalles[diametro]', document.getElementById('diametro_cristal').value);
                    formData.append('detalles[peso]', document.getElementById('peso_cristal').value);
                    break;
                case 'Textil':
                    formData.append('detalles[tipo_tejido]', document.getElementById('detalle_tipo_tejido').value);
                    formData.append('detalles[fibra]', JSON.stringify(splitPorComa(document.getElementById('detalle_fibra').value)));
                    formData.append('detalles[tecnica]', document.getElementById('detalle_tecnica_textil').value);
                    formData.append('detalles[urdimbre]', document.getElementById('detalle_urdimbre').value);
                    formData.append('detalles[trama]', document.getElementById('detalle_trama').value);
                    break;
                case 'Grabado':
                    formData.append('detalles[soporte]', document.getElementById('detalle_soporte_grabado').value);
                    formData.append('detalles[tecnica_grabado]', document.getElementById('detalle_tecnica_grabado').value);
                    formData.append('detalles[tiraje]', document.getElementById('detalle_tiraje_grabado').value);
                    formData.append('detalles[num_edicion]', document.getElementById('detalle_num_edicion').value);
                    formData.append('detalles[tinta]', document.getElementById('detalle_tinta').value);
                    break;
                case 'Acuarela':
                    formData.append('detalles[soporte]', document.getElementById('detalle_soporte_acuarela').value);
                    formData.append('detalles[tecnica]', document.getElementById('detalle_tecnica_acuarela').value);
                    formData.append('detalles[estilos]', JSON.stringify(splitPorComa(document.getElementById('detalle_estilos_acuarela').value)));
                    formData.append('detalles[tematicas]', JSON.stringify(splitPorComa(document.getElementById('detalle_tematicas_acuarela').value)));
                    break;
            }

            try {
                let url = `${API_BASE}/catalogo/obras`;
                let method = 'POST';
                if (editId) {
                    url += `/${editId}`;
                    method = 'PUT';
                }
                const res = await authFetch(url, {
                    method,
                    body: formData
                });
                if (res.ok) {
                    alert(editId ? 'Obra actualizada' : 'Obra creada');
                    cancelarFormulario();
                    cargarObras();
                } else {
                    const err = await res.json();
                    alert('Error: ' + err.error);
                }
            } catch (error) {
                alert('Error de conexión');
            }
        });

        
        function mostrarFormulario() {
            document.getElementById('formContainer').classList.remove('hidden');
            document.getElementById('obraForm').reset();
            document.getElementById('previewContainer').innerHTML = '';
            document.getElementById('codigo_inventario').value = '';
            editId = null;
            currentEstado = null;
            document.getElementById('formTitle').innerText = 'Nueva obra';
        }

        
        function cancelarFormulario() {
            document.getElementById('formContainer').classList.add('hidden');
            editId = null;
            currentEstado = null;
        }
    </script>
</body>
</html>

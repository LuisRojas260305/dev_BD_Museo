<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Usuarios</title>
  <link rel="stylesheet" href="/css/museo.css">
  <style>
    .page-wrap { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
    h2 { font-family: var(--font-serif); font-size: 1.35rem; font-weight: 400; color: var(--text); margin-bottom: 1.2rem; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow); }
    th, td { padding: 0.8rem 1rem; text-align: left; border-bottom: 1px solid var(--border-light); font-size: 0.88rem; }
    th { background: var(--text); color: rgba(245,241,232,0.85); font-weight: 500; font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; }
    td { color: var(--text-muted); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--warm-white); }
    .form-container { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; animation: fadeUp 0.3s ease; }
    .form-container h3 { font-family: var(--font-serif); font-size: 1.05rem; font-weight: 500; margin-bottom: 1rem; color: var(--text); }
    .hidden { display: none; }
    .form-group { margin-bottom: 0.9rem; }
    label { display: block; margin-bottom: 0.3rem; font-size: 0.82rem; font-weight: 500; color: var(--text-muted); }
    input:not([type=file]):not([type=checkbox]), select { width: 100%; padding: 0.5rem 0.7rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.88rem; font-family: var(--font-sans); color: var(--text); background: var(--cream); box-sizing: border-box; }
    input:focus, select:focus { outline: none; border-color: var(--wine); }
    .btn { background: var(--wine); color: white; border: none; padding: 0.45rem 0.9rem; border-radius: var(--radius-sm); cursor: pointer; text-decoration: none; display: inline-block; margin: 0.2rem; font-size: 0.82rem; font-family: var(--font-sans); transition: background 0.2s; }
    .btn:hover { background: var(--wine-dark); }
    .btn-danger { background: #b91c1c; }
    .btn-danger:hover { background: #991b1b; }
    .btn-success { background: var(--wine); }
    .btn-warning { background: var(--gold); color: var(--text); }
    .btn-warning:hover { background: #9a7a38; }
  </style>
</head>
<body>
<header class="m-header">
  <a class="m-logo" href="../admin-dashboard.html"><img src="/img/logo.png" alt="Museo de arte contemporáneo"></a>
  <nav class="m-nav">
    <span style="color:rgba(245,241,232,0.55);font-size:.83rem" id="userEmail"></span>
    <a href="../../index.html" class="btn-secondary">Ver sitio</a>
    <a class="btn-primary" style="cursor:pointer" onclick="logout()">Salir</a>
  </nav>
</header>
<div class="page-wrap">
  <a class="back-link" href="../admin-dashboard.html">Volver al panel</a>
  <h2>Gestión de usuarios</h2>
  <button class="btn btn-success" onclick="mostrarFormulario()">Nuevo usuario</button>
        <div id="formContainer" class="form-container hidden">
            <h3 id="formTitle">Nuevo usuario</h3>
            <form id="usuarioForm">
                <input type="hidden" id="usuarioId">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="text" id="password" required>
                </div>
                <div class="form-group">
                    <label for="tipo">Rol</label>
                    <select id="tipo" required>
                        <option value="usuario">Usuario</option>
                        <option value="administrador">Administrador</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success">Guardar</button>
                <button type="button" class="btn btn-danger" onclick="cancelarFormulario()">Cancelar</button>
            </form>
        </div>
        <div id="usuariosList">
            <table>
                <thead><tr><th>ID</th><th>Nombre</th><th>Email</th><th>Tipo</th><th>Acciones</th></tr></thead>
                <tbody id="tablaUsuarios"></tbody>
            </table>
        </div>
    </div>
<footer class="m-footer"><span>&copy; 2026 Museo de arte contemporáneo</span>
  <a class="footer-github" href="https://github.com/LuisRojas260305/dev_BD_Museo/" target="_blank" aria-label="Repositorio en GitHub"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.74.08-.73.08-.73 1.21.09 1.85 1.24 1.85 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0 2.04.14 3 .4 2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.93.43.37.82 1.1.82 2.22v3.29c0 .32.22.7.83.58C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg></a></footer>

    <script src="../../../js/auth.js"></script>
    <script>
        // Gestión de Usuarios (Empleados) - CRUD de usuarios y cambio de roles.
        // API: /usuarios (GET, POST, PUT, DELETE).
        // auth.js (getUser, authFetch para autenticación).

        (function() {
            const user = getUser();
            if (!user || user.tipo !== 'administrador') {
                alert('Acceso no autorizado');
                window.location.href = '../../index.html';
            }
            document.getElementById('userEmail').innerText = user.email;
        })();

        let usuarios = [];
        const tbody = document.getElementById('tablaUsuarios');
        const formContainer = document.getElementById('formContainer');
        const usuarioForm = document.getElementById('usuarioForm');
        const formTitle = document.getElementById('formTitle');
        let editId = null;

        
        async function cargarUsuarios() {
            try {
                const res = await authFetch(`${API_BASE}/usuarios`);
                if (!res.ok) throw new Error('Error al cargar usuarios');
                usuarios = await res.json();
                renderUsuarios();
            } catch (error) {
                console.error(error);
                alert('No se pudieron cargar los usuarios');
            }
        }

        
        function renderUsuarios() {
            tbody.innerHTML = '';
            usuarios.forEach(u => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${u.usuario_id}</td>
                    <td>${u.nombre} ${u.apellido || ''}</td>
                    <td>${u.email}</td>
                    <td>${u.tipo}</td>
                    <td>
                        <button class="btn" onclick="editarUsuario(${u.usuario_id})">Editar</button>
                        ${u.tipo === 'administrador' 
                            ? `<button class="btn btn-warning" onclick="cambiarRol(${u.usuario_id}, 'usuario')">Quitar admin</button>` 
                            : `<button class="btn btn-success" onclick="cambiarRol(${u.usuario_id}, 'administrador')">Hacer admin</button>`
                        }
                        <button class="btn btn-danger" onclick="eliminarUsuario(${u.usuario_id})">Eliminar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        
        function mostrarFormulario(usuario = null) {
            formContainer.classList.remove('hidden');
            if (usuario) {
                formTitle.innerText = 'Editar Usuario';
                document.getElementById('usuarioId').value = usuario.usuario_id;
                document.getElementById('nombre').value = usuario.nombre;
                document.getElementById('apellido').value = usuario.apellido || '';
                document.getElementById('email').value = usuario.email;
                document.getElementById('password').value = ''; // No se muestra la contraseña
                document.getElementById('tipo').value = usuario.tipo;
                editId = usuario.usuario_id;
            } else {
                formTitle.innerText = 'Nuevo usuario';
                usuarioForm.reset();
                document.getElementById('usuarioId').value = '';
                editId = null;
            }
        }

        
        function cancelarFormulario() {
            formContainer.classList.add('hidden');
        }

        
        usuarioForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const usuarioData = {
                nombre: document.getElementById('nombre').value,
                apellido: document.getElementById('apellido').value || null,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                tipo: document.getElementById('tipo').value
            };

            try {
                let url = `${API_BASE}/usuarios`;
                let method = 'POST';
                if (editId) {
                    url += `/${editId}`;
                    method = 'PUT';
                }
                const res = await authFetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(usuarioData)
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Error al guardar');
                }
                alert(editId ? 'Usuario actualizado' : 'Usuario creado');
                cancelarFormulario();
                cargarUsuarios();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });

        
        window.editarUsuario = async function(id) {
            try {
                const res = await authFetch(`${API_BASE}/usuarios/${id}`);
                if (!res.ok) throw new Error('No se pudo obtener el usuario');
                const usuario = await res.json();
                mostrarFormulario(usuario);
            } catch (error) {
                alert('Error: ' + error.message);
            }
        };

        
        window.cambiarRol = async function(id, nuevoTipo) {
            if (!confirm(`¿Cambiar rol del usuario a ${nuevoTipo}?`)) return;

            try {
                // Primero obtener los datos actuales del usuario
                const resGet = await authFetch(`${API_BASE}/usuarios/${id}`);
                if (!resGet.ok) throw new Error('No se pudo obtener el usuario');
                const usuario = await resGet.json();

                // Luego enviar la actualización con todos los datos (excepto password)
                const res = await authFetch(`${API_BASE}/usuarios/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre: usuario.nombre,
                        apellido: usuario.apellido,
                        email: usuario.email,
                        tipo: nuevoTipo
                        // No enviamos password para no cambiarla
                    })
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error);
                }
                alert('Rol actualizado correctamente');
                cargarUsuarios();
            } catch (error) {
                alert('Error al cambiar rol: ' + error.message);
            }
        };

        
        window.eliminarUsuario = async function(id) {
            if (!confirm('¿Eliminar usuario?')) return;
            try {
                const res = await authFetch(`${API_BASE}/usuarios/${id}`, { method: 'DELETE' });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error);
                }
                alert('Usuario eliminado');
                cargarUsuarios();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        };

        
        window.logout = function() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        };

        cargarUsuarios();
    </script>
</body>
</html>

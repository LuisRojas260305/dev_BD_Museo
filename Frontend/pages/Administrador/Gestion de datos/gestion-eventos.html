<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Eventos - Auditoría</title>
  <link rel="stylesheet" href="/css/museo.css">
  <style>
    .page-wrap { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
    .filters { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; align-items: flex-end; }
    .filter-group { display: flex; flex-direction: column; }
    .filter-group label { font-size: 0.78rem; font-weight: 500; color: var(--text-muted); margin-bottom: 0.25rem; }
    .filter-group input, .filter-group select { padding: 0.5rem 0.7rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: 0.88rem; color: var(--text); background: var(--cream); }
    .filter-group input:focus, .filter-group select:focus { outline: none; border-color: var(--wine); }
    .btn-filter { background: var(--wine); color: white; border: none; padding: 0.5rem 1.2rem; border-radius: var(--radius-sm); cursor: pointer; font-family: var(--font-sans); font-size: 0.88rem; transition: background 0.2s; }
    .btn-filter:hover { background: var(--wine-dark); }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow); }
    th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border-light); font-size: 0.86rem; }
    th { background: var(--text); color: rgba(245,241,232,0.85); font-weight: 500; font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; }
    td { color: var(--text-muted); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--warm-white); }
    .pagination { display: flex; justify-content: center; gap: 0.4rem; margin-top: 1.5rem; }
    .pagination button { padding: 0.35rem 0.75rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; font-family: var(--font-sans); font-size: 0.82rem; color: var(--text-muted); transition: all 0.15s; }
    .pagination button:hover:not(:disabled) { background: var(--warm-white); }
    .pagination button.active { background: var(--wine); color: white; border-color: var(--wine); }
    .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
    .loading { text-align: center; padding: 3rem; color: var(--text-light); }
    .error { text-align: center; padding: 2rem; color: #b91c1c; }
    .badge { display: inline-block; padding: 0.12rem 0.5rem; border-radius: 20px; font-size: 0.75rem; font-weight: 500; }
    .badge-info { background: #dbeafe; color: #1d4ed8; }
    .badge-warning { background: #fef3c7; color: #b45309; }
    .badge-critical { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>
<header class="m-header">
  <a class="m-logo" href="../admin-dashboard.html"><img src="/img/logo.png" alt="Museo de arte contemporáneo"></a>
  <nav class="m-nav">
    <a href="../../index.html" class="btn-secondary">Ver sitio</a>
    <a class="btn-primary" style="cursor:pointer" onclick="logout()">Salir</a>
  </nav>
</header>
<div class="page-wrap">
  <a class="back-link" href="../admin-dashboard.html">Volver al panel</a>
  <h2 style="font-family:var(--font-serif);font-size:1.35rem;font-weight:400;color:var(--text);margin-bottom:1.2rem">Eventos de auditoría</h2>
  <div class="filters">
            <div class="filter-group">
                <label>Tipo de evento</label>
                <select id="filterTipo">
                    <option value="">Todos</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Severidad</label>
                <select id="filterSeveridad">
                    <option value="">Todas</option>
                    <option value="info">Info</option>
                    <option value="warning">Warning</option>
                    <option value="critical">Critical</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Desde</label>
                <input type="date" id="filterDesde">
            </div>
            <div class="filter-group">
                <label>Hasta</label>
                <input type="date" id="filterHasta">
            </div>
            <button class="btn-filter" onclick="cargarEventos(1)">Filtrar</button>
        </div>

        <div id="loading" class="loading">Cargando eventos...</div>
        <div id="error" class="error" style="display:none"></div>

        <table id="tablaEventos" style="display:none">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Tipo</th>
                    <th>Usuario</th>
                    <th>Severidad</th>
                    <th>Metadatos</th>
                </tr>
            </thead>
            <tbody id="eventosBody"></tbody>
        </table>

        <div id="pagination" class="pagination" style="display:none"></div>
    </div>

<footer class="m-footer"><span>&copy; 2026 Museo de arte contemporáneo</span>
  <a class="footer-github" href="https://github.com/LuisRojas260305/dev_BD_Museo/" target="_blank" aria-label="Repositorio en GitHub"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.74.08-.73.08-.73 1.21.09 1.85 1.24 1.85 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0 2.04.14 3 .4 2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.93.43.37.82 1.1.82 2.22v3.29c0 .32.22.7.83.58C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg></a></footer>

    <script src="../../../js/auth.js"></script>
    <script>
        // Gestión de Eventos - Visualización y filtrado de eventos de auditoría.
        // API: /eventos (GET con paginación y filtros por tipo, severidad, fecha).
        // auth.js (getUser, authFetch para autenticación).

        const user = getUser();
        if (!user || user.tipo !== 'administrador') {
            alert('Acceso no autorizado');
            window.location.href = '../../index.html';
        }

        
        async function cargarTipos() {
            try {
                const res = await authFetch(`${API_BASE}/eventos?limit=1000`);
                const json = await res.json();
                if (json.data) {
                    const tipos = new Set(json.data.map(e => e.tipo_evento));
                    const select = document.getElementById('filterTipo');
                    tipos.forEach(t => {
                        const opt = document.createElement('option');
                        opt.value = t;
                        opt.textContent = t;
                        select.appendChild(opt);
                    });
                }
            } catch (e) {
                // si falla, no hay tipos para el filtro
            }
        }

        let paginaActual = 1;
        let totalPaginas = 1;

        
        async function cargarEventos(pagina = 1) {
            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            const tabla = document.getElementById('tablaEventos');
            const pagination = document.getElementById('pagination');
            const body = document.getElementById('eventosBody');

            loading.style.display = 'block';
            errorDiv.style.display = 'none';
            body.innerHTML = '';

            const params = new URLSearchParams();
            params.append('limit', 20);
            params.append('page', pagina);

            const tipo = document.getElementById('filterTipo').value;
            if (tipo) params.append('tipo_evento', tipo);
            const severidad = document.getElementById('filterSeveridad').value;
            if (severidad) params.append('severidad', severidad);
            const desde = document.getElementById('filterDesde').value;
            if (desde) params.append('desde', desde);
            const hasta = document.getElementById('filterHasta').value;
            if (hasta) params.append('hasta', hasta);

            try {
                const res = await authFetch(`${API_BASE}/eventos?${params}`);
                if (!res.ok) {
                    if (res.status === 503) throw new Error('Servicio de auditoría no disponible');
                    throw new Error('Error al obtener eventos');
                }
                const json = await res.json();
                const eventos = json.data || [];
                const total = json.total || eventos.length;
                totalPaginas = Math.ceil(total / 20);

                if (eventos.length === 0) {
                    body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#64748b;padding:2rem;">No se encontraron eventos</td></tr>';
                } else {
                    eventos.forEach(e => {
                        const fecha = e.fecha_hora ? new Date(e.fecha_hora).toLocaleString() : '-';
                        const metaStr = e.metadata ? JSON.stringify(e.metadata).substring(0, 100) : '-';
                        const severidadClass = {
                            'info': 'badge-info',
                            'warning': 'badge-warning',
                            'critical': 'badge-critical',
                        }[e.severidad] || 'badge-info';

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td style="white-space:nowrap">${fecha}</td>
                            <td><span class="badge badge-info">${e.tipo_evento || '-'}</span></td>
                            <td>${e.usuario || '-'}</td>
                            <td><span class="badge ${severidadClass}">${e.severidad || '-'}</span></td>
                            <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${metaStr}</td>
                        `;
                        body.appendChild(tr);
                    });
                }

                tabla.style.display = 'table';
                renderPagination(pagina);
                paginaActual = pagina;
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
                tabla.style.display = 'none';
                pagination.style.display = 'none';
            } finally {
                loading.style.display = 'none';
            }
        }

        
        function renderPagination(pagina) {
            const div = document.getElementById('pagination');
            if (totalPaginas <= 1) {
                div.style.display = 'none';
                return;
            }
            div.style.display = 'flex';
            div.innerHTML = '';

            const prev = document.createElement('button');
            prev.textContent = '«';
            prev.disabled = pagina <= 1;
            prev.onclick = () => cargarEventos(pagina - 1);
            div.appendChild(prev);

            for (let i = 1; i <= totalPaginas; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                if (i === pagina) btn.className = 'active';
                btn.onclick = () => cargarEventos(i);
                div.appendChild(btn);
            }

            const next = document.createElement('button');
            next.textContent = '»';
            next.disabled = pagina >= totalPaginas;
            next.onclick = () => cargarEventos(pagina + 1);
            div.appendChild(next);
        }

        // Inicializar
        cargarTipos();
        cargarEventos(1);
    </script>
</body>
</html>

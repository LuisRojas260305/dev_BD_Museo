<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Museo de Arte Contemporaneo</title>
  <link rel="stylesheet" href="/css/museo.css">
  <style>
    /* ---- Filtros ---- */
    .filters-outer {
      background: var(--cream);
      border-bottom: 1px solid var(--border-light);
      padding: 1.2rem 2rem;
    }
    .filters-bar {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      align-items: flex-end;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      flex: 1;
      min-width: 180px;
    }
    .filter-group .form-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.2rem;
    }
    .filter-group .form-select {
      border-radius: var(--radius-sm);
      background: var(--cream);
      font-size: 0.88rem;
      height: 38px;
      padding: 0 0.9rem;
    }
    .filter-check {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      height: 38px;
      align-self: flex-end;
    }
    .filter-check input[type="checkbox"] {
      accent-color: var(--wine);
      width: 15px; height: 15px;
      cursor: pointer;
    }
    .filter-check label {
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }
    .filters-bar .btn {
      align-self: flex-end;
      height: 38px;
      padding: 0 1.5rem;
      font-size: 0.85rem;
      border-radius: var(--radius-sm);
      white-space: nowrap;
    }

    /* ---- Hero intro ---- */
    .page-hero {
      padding: 3rem 2rem 1.8rem;
      max-width: 1100px;
      margin: 0 auto;
      animation: fadeUp 0.4s ease;
    }
    .page-hero h2 {
      font-family: var(--font-serif);
      font-size: 2.6rem;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .page-hero p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 0.9rem;
    }
    .page-hero-accent {
      width: 44px;
      height: 2px;
      background: var(--logo-accent);
      border-radius: 2px;
    }

    /* ---- Galeria ---- */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.8rem;
      padding: 0 2rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ---- Card de obra ---- */
    .obra-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.22s ease;
      display: flex;
      flex-direction: column;
      animation: fadeUp 0.4s ease both;
      position: relative;
    }
    .obra-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 12px 36px rgba(109, 43, 61, 0.14);
      border-color: var(--border);
    }

    .obra-card-img {
      display: block;
      width: 100%;
      height: 240px;
      object-fit: cover;
      background: var(--warm-white);
      transition: transform 0.55s ease;
    }
    .obra-card:hover .obra-card-img { transform: scale(1.06); }
    .obra-card-img-wrap {
      overflow: hidden;
      height: 240px;
      position: relative;
      background: var(--warm-white);
    }
    .obra-card-img-wrap::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 70px;
      background: linear-gradient(to top, rgba(28,23,20,0.18), transparent);
      pointer-events: none;
    }
    .obra-status {
      position: absolute;
      top: 0.6rem;
      left: 0.6rem;
      z-index: 2;
    }

    .obra-card-body {
      padding: 1rem 1.1rem 1.1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .obra-card-title {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }
    .obra-card-title a { color: inherit; text-decoration: none; transition: color 0.18s; }
    .obra-card-title a:hover { color: var(--wine); }

    .obra-card-artist {
      font-size: 0.8rem;
      color: var(--text-light);
    }
    .obra-card-artist a { color: var(--text-light); font-weight: 400; transition: color 0.18s; }
    .obra-card-artist a:hover { color: var(--wine); }

    .obra-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 0.65rem;
      border-top: 1px solid var(--border-light);
    }

    .obra-card-price {
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 600;
      color: var(--wine);
      font-variant-numeric: tabular-nums lining-nums;
      font-feature-settings: "tnum" 1, "lnum" 1;
      letter-spacing: -0.01em;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 5rem 1rem;
      color: var(--text-light);
      font-size: 0.95rem;
    }

    /* scroll-to-top */
    #scrollTop {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 42px;
      height: 42px;
      background: var(--wine);
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(109,43,61,0.35);
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      z-index: 100;
    }
    #scrollTop svg { display: block; }
    #scrollTop:hover { background: var(--wine-dark); transform: translateY(-3px); box-shadow: 0 6px 20px rgba(109,43,61,0.45); }
    #scrollTop.visible { display: flex; }

    @media (max-width: 768px) {
      .filters-outer { padding: 1rem; }
      .filter-group { min-width: 140px; }
      .gallery { padding: 0 1rem 2rem; gap: 1.2rem; }
      .page-hero { padding: 2rem 1rem 1.2rem; }
      .page-hero h2 { font-size: 1.9rem; }
    }
  </style>
</head>
<body>

<header class="m-header">
  <a class="m-logo" href="index.html"><img src="/img/logo.png" alt="Museo de arte contemporáneo"></a>
  <nav class="m-nav" id="authLinks"></nav>
</header>

<div class="page-hero">
  <h2>Colección permanente</h2>
  <p>Obras originales de artistas nacionales e internacionales</p>
  <div class="page-hero-accent"></div>
</div>

<section class="filters-outer">
  <div class="filters-bar">
    <div class="filter-group">
      <label class="form-label" for="genre">Género</label>
      <select class="form-select" id="genre">
        <option value="">Todos los géneros</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="form-label" for="artist">Artista</label>
      <select class="form-select" id="artist">
        <option value="">Todos los artistas</option>
      </select>
    </div>
    <div class="filter-check">
      <input type="checkbox" id="sortByPrice">
      <label for="sortByPrice">Ordenar por precio</label>
    </div>
    <button class="btn btn-wine" id="applyFilters">Aplicar filtros</button>
  </div>
</section>

<main class="gallery" id="gallery"></main>

<div class="m-pagination" id="paginacion" style="display:none">
  <button id="pag-prev">&#8592; Anterior</button>
  <span class="pag-info" id="pag-info"></span>
  <button id="pag-next">Siguiente &#8594;</button>
</div>

<button id="scrollTop" aria-label="Volver arriba">
  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 15l-6-6-6 6"/>
  </svg>
</button>

<footer class="m-footer">
  <span>&copy; 2026 Museo de arte contemporáneo</span>
  <a class="footer-github" href="https://github.com/LuisRojas260305/dev_BD_Museo/" target="_blank" aria-label="Repositorio en GitHub">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.74.08-.73.08-.73 1.21.09 1.85 1.24 1.85 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0 2.04.14 3 .4 2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.93.43.37.82 1.1.82 2.22v3.29c0 .32.22.7.83.58C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg>
  </a>
</footer>

<script src="../js/auth.js"></script>
<script>
  let generos = [];
  let artistas = [];

  function updateAuthButtons() {
    const loggedIn = isLoggedIn();
    const user = getUser();
    const nav = document.getElementById('authLinks');
    if (loggedIn) {
      let adminLink = '';
      if (user.tipo === 'administrador') {
        adminLink = '<a href="Administrador/admin-dashboard.html" class="btn-ghost">Admin</a>';
      }
      nav.innerHTML = `
        <a href="Perfiles/perfil.html" class="btn-secondary">Mi perfil</a>
        ${adminLink}
        <a class="btn-primary" style="cursor:pointer" onclick="logout()">Salir</a>
      `;
    } else {
      nav.innerHTML = `
        <a class="btn-secondary" href="Principal/login.html">Iniciar sesión</a>
        <a class="btn-primary" href="Principal/registro.html">Registrarse</a>
      `;
    }
  }

  async function cargarGeneros() {
    try {
      const res = await fetch(`${API_BASE}/catalogo/generos`);
      const result = await res.json();
      generos = result.data || [];
      const select = document.getElementById('genre');
      generos.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g.nombre;
        opt.textContent = g.nombre;
        select.appendChild(opt);
      });
    } catch (e) { console.error('Error generos:', e); }
  }

  async function cargarArtistas() {
    try {
      const res = await fetch(`${API_BASE}/catalogo/artistas?sort=nombre`);
      const json = await res.json();
      artistas = json.data || [];
      const select = document.getElementById('artist');
      artistas.forEach(a => {
        const opt = document.createElement('option');
        opt.value = a.artista_id_original || a._id;
        opt.textContent = a.nombre + (a.apellido ? ' ' + a.apellido : '');
        select.appendChild(opt);
      });
    } catch (e) { console.error('Error artistas:', e); }
  }

  let _paginaActual = 1;
  let _totalPaginas = 1;
  let _totalObras   = 0;

  async function cargarObras(pagina) {
    pagina = pagina || 1;
    _paginaActual = pagina;
    const generoId  = document.getElementById('genre').value;
    const artistaId = document.getElementById('artist').value;
    const ordenar   = document.getElementById('sortByPrice').checked;
    const params    = new URLSearchParams();
    if (generoId)  params.append('genero', generoId);
    if (artistaId) params.append('artista_id', artistaId);
    if (ordenar)   params.append('orden', 'precio');
    params.append('limit', '20');
    params.append('page', pagina);

    let obras = [];
    try {
      const res  = await fetch(`${API_BASE}/catalogo?${params}`);
      const data = await res.json();
      if (data.data && data.data.length > 0) {
        obras = data.data;
        _totalObras   = data.total || 0;
        _totalPaginas = data.totalPages || 1;
      }
    } catch (e) { console.error('Error obras:', e); }
    renderObras(obras);
    actualizarPaginacion();
  }

  function actualizarPaginacion() {
    const ctrl = document.getElementById('paginacion');
    if (!ctrl) return;
    if (_totalPaginas <= 1) { ctrl.style.display = 'none'; return; }
    ctrl.style.display = 'flex';
    document.getElementById('pag-info').textContent =
      'Página ' + _paginaActual + ' de ' + _totalPaginas + ' (' + _totalObras + ' obras)';
    document.getElementById('pag-prev').disabled = _paginaActual <= 1;
    document.getElementById('pag-next').disabled = _paginaActual >= _totalPaginas;
  }

  function renderObras(obras) {
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '';
    if (obras.length === 0) {
      gallery.innerHTML = '<div class="no-results">No se encontraron obras con esos filtros.</div>';
      return;
    }
    obras.forEach((obra, i) => {
      const artistaNombre = obra.artista_nombre || 'Desconocido';
      const artistaId     = obra.artista_id || obra.artista_id_original;
      const generoNombre  = obra.genero_nombre || obra.genero || '';
      const obraId        = obra.obra_id || obra.obra_id_original || obra._id;
      const precio        = typeof obra.precio_venta === 'object'
        ? (Number(obra.precio_venta._serialized) || 0)
        : (obra.precio_venta || 0);
      const imagenUrl     = obra.fotos && obra.fotos.length > 0
        ? obra.fotos[0]
        : 'https://via.placeholder.com/300x200?text=sin+imagen';

      let chipClass = 'chip-disponible', chipText = 'Disponible';
      if (obra.estado === 'Reservada') { chipClass = 'chip-reservada'; chipText = 'Reservada'; }
      else if (obra.estado === 'Vendida') { chipClass = 'chip-vendida'; chipText = 'Vendida'; }

      const card = document.createElement('div');
      card.className = 'obra-card';
      card.style.animationDelay = (i % 10 * 0.04) + 's';
      card.innerHTML = `
        <a href="Principal/detalle.html?id=${obraId}" class="obra-card-img-wrap">
          <img class="obra-card-img" src="${imagenUrl}"
            alt="${obra.nombre}"
            loading="lazy" decoding="async"
            onerror="this.src='https://placehold.co/480x360/f5f1e8/9c8a7a?text=sin+imagen'">
          <span class="status-chip ${chipClass} obra-status">${chipText}</span>
        </a>
        <div class="obra-card-body">
          <div class="obra-card-title">
            <a href="Principal/detalle.html?id=${obraId}">${obra.nombre}</a>
          </div>
          <div class="obra-card-artist">
            ${artistaId
              ? `<a href="Principal/artista.html?id=${artistaId}">${artistaNombre}</a>`
              : `<span>${artistaNombre}</span>`}
          </div>
          <div class="obra-card-footer">
            <span class="badge badge-muted">${generoNombre}</span>
            <span class="obra-card-price">${precio.toLocaleString()} $</span>
          </div>
        </div>
      `;
      gallery.appendChild(card);
    });
  }

  updateAuthButtons();
  cargarGeneros().then(() => cargarArtistas()).then(() => cargarObras(1));

  document.getElementById('applyFilters').addEventListener('click', () => cargarObras(1));
  document.getElementById('pag-prev').addEventListener('click', () => { cargarObras(_paginaActual - 1); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  document.getElementById('pag-next').addEventListener('click', () => { cargarObras(_paginaActual + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); });

  const scrollBtn = document.getElementById('scrollTop');
  window.addEventListener('scroll', () => {
    scrollBtn.classList.toggle('visible', window.scrollY > 400);
  });
  scrollBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
</script>
</body>
</html>

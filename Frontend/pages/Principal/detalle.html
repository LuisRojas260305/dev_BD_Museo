<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Museo - detalle de obra</title>
  <link rel="stylesheet" href="/css/museo.css">
  <style>
    .page-wrap { max-width: 1200px; margin: 0 auto; padding: 1.5rem 2rem 0; }

    .detail-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 2rem;
      box-shadow: var(--shadow-md);
      margin: 1rem 0 2rem;
      animation: fadeUp 0.45s ease;
    }

    .detail-image-wrap {
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--warm-white);
      height: 440px;
      box-shadow: var(--shadow);
    }
    .detail-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .detail-image-wrap:hover img { transform: scale(1.02); }

    .detail-info { display: flex; flex-direction: column; gap: 0.8rem; }

    .detail-title {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
    }
    .detail-title-accent {
      width: 32px;
      height: 2px;
      background: var(--logo-accent);
      border-radius: 2px;
    }

    .detail-artist {
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .detail-artist a { color: var(--wine); font-weight: 500; }
    .detail-artist a:hover { color: var(--wine-dark); }

    .detail-description {
      font-size: 0.92rem;
      line-height: 1.7;
      color: var(--text-muted);
      padding: 1rem 0;
      border-top: 1px solid var(--border-light);
      border-bottom: 1px solid var(--border-light);
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.8rem;
    }
    .meta-item { display: flex; flex-direction: column; gap: 0.15rem; }
    .meta-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-light);
    }
    .meta-value { font-size: 0.95rem; font-weight: 500; color: var(--text); }

    .detail-price {
      font-family: var(--font-sans);
      font-size: 2rem;
      font-weight: 700;
      color: var(--wine);
      font-variant-numeric: tabular-nums lining-nums;
      font-feature-settings: "tnum" 1, "lnum" 1;
      letter-spacing: -0.02em;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.75rem 0.3rem 0.55rem;
      border-radius: 100px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
      align-self: flex-start;
    }
    .status-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-disponible { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .status-disponible::before { background: #22c55e; }
    .status-vendido    { background: var(--wine-tint); color: var(--wine-dark); border: 1px solid rgba(109,43,61,0.25); }
    .status-vendido::before    { background: var(--wine); }
    .status-reservado  { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
    .status-reservado::before  { background: #f97316; }

    .visits-count {
      font-size: 0.8rem;
      color: var(--text-light);
    }

    .features-section {
      background: var(--warm-white);
      border-radius: var(--radius-md);
      padding: 1.2rem;
      margin: 0.5rem 0;
    }
    .features-section h3 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-family: var(--font-sans);
      margin-bottom: 0.8rem;
    }
    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.6rem;
    }
    .feature-item {
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--border-light);
    }
    .feature-label { font-size: 0.72rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.04em; }
    .feature-value { font-size: 0.92rem; font-weight: 500; color: var(--text); margin-top: 0.15rem; word-break: break-word; }

    .btn-comprar {
      background: var(--wine);
      color: white;
      border: none;
      padding: 0.9rem 1.5rem;
      font-size: 1rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      width: 100%;
      font-weight: 500;
      font-family: var(--font-sans);
      letter-spacing: 0.02em;
      transition: background 0.25s ease, transform 0.2s ease;
      margin-top: auto;
    }
    .btn-comprar:hover:not(:disabled) { background: var(--wine-dark); transform: translateY(-1px); }
    .btn-comprar:disabled { background: var(--beige); color: var(--text-light); cursor: not-allowed; }

    .not-found {
      text-align: center;
      padding: 4rem;
      color: var(--text-light);
    }

    /* Resenas */
    .resenas-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem 3rem;
      animation: fadeUp 0.4s ease both;
    }
    .resenas-header {
      font-family: var(--font-serif);
      font-size: 1.3rem;
      font-weight: 400;
      margin-bottom: 1.2rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--border-light);
    }
    .rating-summary {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      background: var(--warm-white);
      padding: 1rem 1.5rem;
      border-radius: var(--radius-md);
      margin-bottom: 1.5rem;
      border: 1px solid var(--border-light);
    }
    .rating-big { font-size: 2.5rem; font-weight: 700; color: var(--gold); font-family: var(--font-serif); }
    .stars-display { font-size: 1.2rem; color: var(--gold); }
    .rating-count { font-size: 0.82rem; color: var(--text-muted); }

    .resena-form {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 1.2rem;
      margin-bottom: 1.5rem;
    }
    .resena-form h4 { font-family: var(--font-serif); font-size: 1rem; font-weight: 500; margin-bottom: 0.8rem; color: var(--text); }
    .star-picker { display: flex; gap: 0.3rem; margin-bottom: 0.8rem; }
    .star-picker span {
      font-size: 1.8rem;
      cursor: pointer;
      color: var(--beige);
      transition: color 0.15s;
      user-select: none;
    }
    .star-picker span.active { color: var(--gold); }
    .resena-form textarea {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      resize: vertical;
      min-height: 70px;
      font-family: var(--font-sans);
      color: var(--text);
      background: var(--cream);
    }
    .resena-form textarea:focus { outline: none; border-color: var(--wine); }
    .btn-resena {
      margin-top: 0.6rem;
      background: var(--wine);
      color: white;
      border: none;
      padding: 0.5rem 1.3rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.85rem;
      font-family: var(--font-sans);
      transition: background 0.2s ease;
    }
    .btn-resena:hover { background: var(--wine-dark); }

    .resena-card {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 1rem 1.2rem;
      margin-bottom: 0.7rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .resena-card:hover {
      border-color: var(--border);
      box-shadow: var(--shadow);
    }
    .resena-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem; }
    .resena-autor { font-weight: 600; color: var(--text); font-size: 0.9rem; }
    .resena-stars { color: var(--gold); }
    .resena-fecha { color: var(--text-light); font-size: 0.78rem; }
    .resena-texto { color: var(--text-muted); font-size: 0.88rem; margin-top: 0.3rem; }
    .login-hint { color: var(--text-light); font-size: 0.88rem; }
    .login-hint a { color: var(--wine); }

    @media (max-width: 768px) {
      .detail-layout { grid-template-columns: 1fr; }
      .meta-grid { grid-template-columns: 1fr; }
      .page-wrap, .resenas-wrap { padding-left: 1rem; padding-right: 1rem; }
    }

    /* ---- Recomendaciones (Neo4j) ---- */
    .reco-section {
      position: relative;
      background:
        radial-gradient(120% 80% at 100% 0%, rgba(109,43,61,0.06), transparent 60%),
        linear-gradient(180deg, var(--surface), var(--cream));
      border-top: 1px solid var(--border-light);
      padding-bottom: 2.4rem;
      overflow: hidden;
      animation: fadeUp 0.5s ease;
    }
    .reco-head {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.4rem 2rem 0.2rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .reco-head h2 {
      font-family: var(--font-serif); font-size: 1.7rem; color: var(--text);
      font-weight: 600; letter-spacing: -0.02em;
    }
    .reco-head p { font-size: 0.9rem; color: var(--text-muted); margin-top: 0.3rem; max-width: 60ch; }
    .reco-carousel { position: relative; max-width: 1200px; margin: 0 auto; padding: 1.3rem 2rem 0.4rem; }
    .reco-track {
      display: flex; gap: 1.5rem; overflow-x: auto; scroll-behavior: smooth;
      scroll-snap-type: x mandatory; -ms-overflow-style: none; scrollbar-width: none;
      padding: 0.3rem 0.2rem 0.6rem;
    }
    .reco-track::-webkit-scrollbar { display: none; }
    .reco-track .obra-card { flex: 0 0 calc((100% - 3 * 1.5rem) / 4); scroll-snap-align: start; border-color: rgba(109,43,61,0.16); }
    .reco-track .obra-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--wine), var(--gold, #c89b3c));
      opacity: 0; transition: opacity 0.25s ease; z-index: 3;
    }
    .reco-track .obra-card:hover::before { opacity: 1; }
    .reco-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--surface); border: 1px solid var(--border); color: var(--wine);
      cursor: pointer; display: none; align-items: center; justify-content: center;
      box-shadow: 0 6px 20px rgba(28,23,20,0.16); transition: background 0.2s ease, transform 0.2s ease; z-index: 4;
    }
    .reco-arrow:hover { background: var(--wine); color: #fff; transform: translateY(-50%) scale(1.08); }
    .reco-arrow.show { display: flex; }
    .reco-arrow.reco-prev { left: 0.4rem; }
    .reco-arrow.reco-next { right: 0.4rem; }
    .reco-arrow svg { display: block; }
    .reco-motivo {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-size: 0.7rem; color: var(--wine);
      background: var(--wine-tint, rgba(109,43,61,0.08));
      border-radius: 100px; padding: 0.15rem 0.6rem;
      align-self: flex-start; font-weight: 600;
    }

    /* ---- Card de obra (reutilizada en el carrusel) ---- */
    .obra-card {
      background: var(--surface); border-radius: var(--radius-md);
      border: 1px solid var(--border-light); overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.22s ease;
      display: flex; flex-direction: column; animation: fadeUp 0.4s ease both; position: relative;
    }
    .obra-card:hover { transform: translateY(-7px); box-shadow: 0 12px 36px rgba(109, 43, 61, 0.14); border-color: var(--border); }
    .obra-card-img-wrap { overflow: hidden; height: 200px; position: relative; background: var(--warm-white); display: block; }
    .obra-card-img { display: block; width: 100%; height: 200px; object-fit: cover; background: var(--warm-white); transition: transform 0.55s ease; }
    .obra-card:hover .obra-card-img { transform: scale(1.06); }
    .obra-status { position: absolute; top: 0.6rem; left: 0.6rem; z-index: 2; }
    .obra-card-body { padding: 0.9rem 1rem 1rem; flex: 1; display: flex; flex-direction: column; gap: 0.3rem; }
    .obra-card-title { font-family: var(--font-serif); font-size: 1rem; font-weight: 600; color: var(--text); line-height: 1.3; }
    .obra-card-title a { color: inherit; text-decoration: none; transition: color 0.18s; }
    .obra-card-title a:hover { color: var(--wine); }
    .obra-card-artist { font-size: 0.8rem; color: var(--text-light); }
    .obra-card-artist a { color: var(--text-light); font-weight: 400; transition: color 0.18s; }
    .obra-card-artist a:hover { color: var(--wine); }
    .obra-card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 0.6rem; border-top: 1px solid var(--border-light); }
    .obra-card-price { font-family: var(--font-sans); font-size: 0.95rem; font-weight: 600; color: var(--wine); font-variant-numeric: tabular-nums lining-nums; }
    @media (max-width: 768px) {
      .reco-head { padding: 1.8rem 1rem 0.2rem; }
      .reco-carousel { padding: 1.2rem 1rem 0.4rem; }
      .reco-track .obra-card { flex: 0 0 80%; }
    }
  </style>
</head>
<body>

<header class="m-header">
  <a class="m-logo" href="../index.html"><img src="/img/logo.png" alt="Museo de arte contemporáneo"></a>
  <nav class="m-nav" id="authLinks"></nav>
</header>

<div class="page-wrap">
  <a class="back-link" href="../index.html">Volver al catálogo</a>
  <div id="detailMain"></div>
</div>

<section class="resenas-wrap" id="resenasSection" style="display:none">
  <h3 class="resenas-header">Reseñas</h3>
  <div class="rating-summary" id="ratingSummary"></div>
  <div id="resenaFormContainer"></div>
  <div id="resenasList"></div>
</section>

<section class="reco-section" id="recoSection" style="display:none">
  <div class="reco-head">
    <div>
      <h2 id="recoTitle">Recomendado para ti</h2>
      <p id="recoSubtitle">Una selección a partir de lo que has adquirido</p>
    </div>
  </div>
  <div class="reco-carousel">
    <button class="reco-arrow reco-prev" id="recoPrev" aria-label="Anterior">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="reco-track" id="recoTrack"></div>
    <button class="reco-arrow reco-next" id="recoNext" aria-label="Mostrar más">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</section>

<footer class="m-footer">
  <span>&copy; 2026 Museo de arte contemporáneo</span>
  <a class="footer-github" href="https://github.com/LuisRojas260305/dev_BD_Museo/" target="_blank" aria-label="Repositorio en GitHub"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.74.08-.73.08-.73 1.21.09 1.85 1.24 1.85 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0 2.04.14 3 .4 2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.93.43.37.82 1.1.82 2.22v3.29c0 .32.22.7.83.58C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg></a>
</footer>

<script src="../../js/auth.js"></script>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const obraId = urlParams.get('id');

  function updateAuthButtons() {
    const loggedIn = isLoggedIn();
    const user = getUser();
    const nav = document.getElementById('authLinks');
    if (loggedIn) {
      nav.innerHTML = `
        <a href="../Perfiles/perfil.html" class="btn-secondary">Mi perfil</a>
        <a class="btn-primary" style="cursor:pointer" onclick="logout()">Salir</a>
      `;
    } else {
      nav.innerHTML = `
        <a class="btn-secondary" href="login.html">Iniciar sesión</a>
        <a class="btn-primary" href="registro.html">Registrarse</a>
      `;
    }
  }

  async function cargarObra() {
    let obra;
    try {
      const res = await fetch(`${API_BASE}/catalogo/${obraId}`);
      if (!res.ok) throw new Error('no encontrada');
      const json = await res.json();
      obra = json.data;
      obra.obra_id = obra.obra_id || obra.obra_id_original || obra._id;
      obra.precio_venta = typeof obra.precio_venta === 'object'
        ? (Number(obra.precio_venta._serialized) || 0) : (obra.precio_venta || 0);
      obra.alto = typeof obra.alto === 'object'
        ? (Number(obra.alto._serialized) || 0) : (obra.alto || 0);
      obra.ancho = typeof obra.ancho === 'object'
        ? (Number(obra.ancho._serialized) || 0) : (obra.ancho || 0);
      render(obra);
      cargarResenas(obra._id);
      registrarYMostrarVisitas(obra._id);
    } catch (error) {
      document.getElementById('detailMain').innerHTML = '<div class="not-found">Obra no encontrada</div>';
    }
  }

  function render(obra) {
    // MongoDB guarda el estado como string: 'Disponible', 'Reservada', 'Vendida'
    const estadoTexto = obra.estado || 'Desconocido';
    const user = getUser();

    const puedeComprar = (estadoTexto === 'Disponible') && user &&
      (user.tipo === 'miembro' || user.tipo === 'administrador');

    const botonCompra = puedeComprar
      ? `<button class="btn-comprar" onclick="window.location.href='confirmar-compra.html?id=${obra.obra_id}'">Solicitar compra</button>`
      : (estadoTexto !== 'Disponible'
          ? `<button class="btn-comprar" disabled>No disponible</button>`
          : `<button class="btn-comprar" onclick="alert('Debes ser miembro para comprar'); window.location.href='login.html';">Iniciar sesión como miembro</button>`);

    const nombresLegibles = {
      soporte_nombre: 'soporte', estilos: 'estilos', tematicas: 'temáticas',
      tipo_nombre: 'tipo', peso: 'peso (kg)', profundidad: 'profundidad (cm)',
      materiales: 'materiales', tecnicas: 'técnicas',
      tiraje: 'tiraje', obturacion: 'obturación', apertura: 'apertura',
      iso: 'iso', resolucion: 'resolución', fecha_captura: 'fecha de captura',
      impresion_nombre: 'impresión', camara_nombre: 'cámara',
      tecnica_fotografica_nombre: 'técnica',
      diametro: 'diámetro (cm)', funcionalidad: 'funcionalidad',
      coccion_nombre: 'cocción', arcilla_nombre: 'arcilla',
      modelado_nombre: 'modelado', esmaltado_nombre: 'esmaltado',
      pieza_nombre: 'pieza', metal_predominante_nombre: 'metal predominante',
      otros_metales: 'otros metales', alto: 'alto (cm)', ancho: 'ancho (cm)'
    };

    let featuresHTML = '';
    if (obra.detalles && Object.keys(obra.detalles).length > 0) {
      const excluir = ['obra_id','soporte_id','tipo_id','impresion_id','camara_id',
        'tecnica_id','coccion_id','arcilla_id','modelado_id','esmaltado_id','pieza_id','metal_predominante_id'];
      const items = Object.entries(obra.detalles)
        .filter(([k, v]) => !excluir.includes(k) && v && v.toString().trim() !== '')
        .map(([k, v]) => ({
          label: nombresLegibles[k] || k.replace(/_/g, ' '),
          value: Array.isArray(v) ? v.join(', ') : v
        }));
      if (items.length > 0) {
        featuresHTML = `
          <div class="features-section">
            <h3>Características</h3>
            <div class="feature-grid">
              ${items.map(it => `
                <div class="feature-item">
                  <div class="feature-label">${it.label}</div>
                  <div class="feature-value">${it.value}</div>
                </div>`).join('')}
            </div>
          </div>`;
      }
    }

    const estadoClase = {
      'Disponible': 'status-disponible',
      'Vendida':    'status-vendido',
      'Reservada':  'status-reservado'
    }[estadoTexto] || '';

    const phDetalle = placeholderObra(obra.nombre, obra.genero_nombre || obra.genero);
    const fotoDet   = obra.fotos && obra.fotos.length > 0 ? obra.fotos[0] : '';
    const imagenUrl = (fotoDet && !/placehold\.co|via\.placeholder|placeholder\.com/i.test(fotoDet))
      ? fotoDet : phDetalle;

    const metaItems = [];
    if (obra.fecha_creacion) metaItems.push({ label: 'fecha', value: obra.fecha_creacion.split('T')[0] });
    if (obra.alto && obra.ancho) metaItems.push({ label: 'dimensiones', value: `${obra.alto} x ${obra.ancho} cm` });
    else if (obra.alto) metaItems.push({ label: 'alto', value: `${obra.alto} cm` });
    else if (obra.ancho) metaItems.push({ label: 'ancho', value: `${obra.ancho} cm` });

    const metaHTML = metaItems.length > 0 ? `
      <div class="meta-grid">
        ${metaItems.map(m => `
          <div class="meta-item">
            <span class="meta-label">${m.label}</span>
            <span class="meta-value">${m.value}</span>
          </div>`).join('')}
      </div>` : '';

    document.getElementById('detailMain').innerHTML = `
      <div class="detail-layout">
        <div class="detail-image-wrap">
          <img src="${imagenUrl}" alt="${obra.nombre}"
            decoding="async"
            onerror="this.onerror=null;this.src='${phDetalle}'">
        </div>
        <div class="detail-info">
          <h2 class="detail-title">${obra.nombre}</h2>
          <div class="detail-title-accent"></div>
          <p class="detail-artist">por ${obra.artista_id
            ? `<a href="artista.html?id=${obra.artista_id}">${obra.artista_nombre}</a>`
            : '<span>Artista desconocido</span>'}</p>
          <span class="badge badge-muted" style="align-self:flex-start">${obra.genero_nombre || ''}</span>
          ${obra.descripcion ? `<p class="detail-description">${obra.descripcion}</p>` : ''}
          ${metaHTML}
          <div class="detail-price">${Number(obra.precio_venta).toLocaleString()} $</div>
          <div class="status-badge ${estadoClase}">${estadoTexto}</div>
          <div class="visits-count" id="visitasCount">Cargando visitas...</div>
          ${featuresHTML}
          ${botonCompra}
        </div>
      </div>
    `;
  }

  updateAuthButtons();
  cargarObra();

  const API_RESENAS = 'http://localhost:3000/api/resenas';
  let obraIdGlobal = null;
  let ratingSeleccionado = 0;

  function estrellas(n, total = 5) {
    let s = '';
    for (let i = 1; i <= total; i++) s += i <= n ? '★' : '☆';
    return s;
  }

  async function cargarResenas(obra_id) {
    obraIdGlobal = obra_id;
    const section = document.getElementById('resenasSection');
    section.style.display = 'block';

    const r = await fetch(`${API_RESENAS}/${obra_id}`);
    const d = await r.json();

    document.getElementById('ratingSummary').innerHTML = `
      <div class="rating-big">${d.promedio || '-'}</div>
      <div>
        <div class="stars-display">${estrellas(Math.round(d.promedio))}</div>
        <div class="rating-count">${d.total} reseña${d.total !== 1 ? 's' : ''}</div>
      </div>`;

    const user = getUser ? getUser() : null;
    const formContainer = document.getElementById('resenaFormContainer');
    if (user) {
      formContainer.innerHTML = `
        <div class="resena-form">
          <h4>Tu reseña</h4>
          <div class="star-picker" id="starPicker">
            ${[1,2,3,4,5].map(i => `<span data-v="${i}" onclick="selStar(${i})">&#9733;</span>`).join('')}
          </div>
          <textarea id="resenaComentario" placeholder="Escribe tu opinión (opcional)..."></textarea>
          <button class="btn-resena" onclick="enviarResena()">Publicar reseña</button>
        </div>`;
    } else {
      formContainer.innerHTML = `<p class="login-hint"><a href="login.html">Inicia sesión</a> para dejar una reseña.</p>`;

    }

    const lista = document.getElementById('resenasList');
    if (!d.resenas || d.resenas.length === 0) {
      lista.innerHTML = '<p class="login-hint">Sin reseñas aún.</p>';

      return;
    }
    lista.innerHTML = d.resenas.map(r => `
      <div class="resena-card">
        <div class="resena-header">
          <span class="resena-autor">${r.nombre} ${r.apellido || ''}</span>
          <span class="resena-stars">${estrellas(r.rating)}</span>
        </div>
        <div class="resena-fecha">${new Date(r.fecha).toLocaleDateString('es-ES')}</div>
        ${r.comentario ? `<div class="resena-texto">${r.comentario}</div>` : ''}
      </div>`).join('');
  }

  window.selStar = function(n) {
    ratingSeleccionado = n;
    document.querySelectorAll('#starPicker span').forEach(s => {
      s.classList.toggle('active', parseInt(s.dataset.v) <= n);
    });
  };

  async function registrarYMostrarVisitas(obra_id) {
    try {
      await fetch(`http://localhost:3000/api/visitas/${obra_id}`, { method: 'POST' });
      const r = await fetch(`http://localhost:3000/api/visitas/${obra_id}`);
      const d = await r.json();
      const el = document.getElementById('visitasCount');
      if (el) el.textContent = `${d.total} vista${d.total !== 1 ? 's' : ''}`;
    } catch {}
  }

  window.enviarResena = async function() {
    if (!ratingSeleccionado) return alert('Selecciona una puntuación.');
    const comentario = document.getElementById('resenaComentario').value.trim();
    const token = localStorage.getItem('token');
    const r = await fetch(API_RESENAS, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ obra_id: obraIdGlobal, rating: ratingSeleccionado, comentario })
    });
    const d = await r.json();
    if (d.success) {
      ratingSeleccionado = 0;
      cargarResenas(obraIdGlobal);
    } else {
      alert('Error: ' + d.error);
    }
  };

  // -------------------------------------------------------------------------
  // Recomendaciones (grafo Neo4j) - mismo carrusel del catálogo. Aparece solo
  // si el usuario inició sesión y tiene compras; excluye la obra actual.
  // -------------------------------------------------------------------------
  // Paleta museística suave por género (placeholder local, sin servicios externos).
  const PH_PALETA = {
    'Pintura':     ['#e8dccb', '#d8c3a5', '#8a6d4b'],
    'Escultura':   ['#e3e0db', '#cfcabf', '#6f6a60'],
    'Orfebrería':  ['#efe4c6', '#e0cf9a', '#9c7d3c'],
    'Cerámica':    ['#ecd9c9', '#dcbfa6', '#9a6a4b'],
    'Fotografía':  ['#dadde0', '#bcc2c7', '#5b626a'],
    'Cristalería': ['#d8e6e6', '#b6d2d2', '#4f7e7e'],
    'Textil':      ['#e7d8da', '#d3b3b8', '#8c5b63'],
    'Grabado':     ['#ddd9d2', '#c2bcb1', '#6a6358'],
    'Acuarela':    ['#dde6ec', '#bcd0dd', '#5a7d92'],
  };
  function placeholderObra(texto, genero) {
    const t = String(texto || 'Museo').replace(/[<>&]/g, '').slice(0, 18);
    const pal = PH_PALETA[genero] || ['#efe9df', '#e2d9cb', '#9c8a7a'];
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='480' height='360'>
      <defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
        <stop offset='0' stop-color='${pal[0]}'/><stop offset='1' stop-color='${pal[1]}'/>
      </linearGradient></defs>
      <rect width='480' height='360' fill='url(#g)'/>
      <rect x='26' y='26' width='428' height='308' fill='none' stroke='${pal[2]}' stroke-opacity='0.35' stroke-width='1.5'/>
      <circle cx='240' cy='150' r='42' fill='none' stroke='${pal[2]}' stroke-width='2.5' stroke-opacity='0.7'/>
      <path d='M222 150l13 13 26-30' fill='none' stroke='${pal[2]}' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' stroke-opacity='0.7'/>
      <text x='240' y='244' font-family='Georgia,serif' font-size='25' fill='${pal[2]}' text-anchor='middle'>${t}</text>
    </svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  function construirObraCard(obra, i) {
    const artistaNombre = obra.artista_nombre || obra.artista || 'Desconocido';
    const artistaId     = obra.artista_id || obra.artista_id_original;
    const generoNombre  = obra.genero_nombre || obra.genero || '';
    const oid           = obra.obra_id || obra.obra_id_original || obra._id;
    const precio        = typeof obra.precio_venta === 'object'
      ? (Number(obra.precio_venta._serialized) || 0)
      : (Number(obra.precio_venta != null ? obra.precio_venta : obra.precio) || 0);
    const ph            = placeholderObra(generoNombre || obra.nombre, generoNombre);
    const fotoCruda     = obra.fotos && obra.fotos.length > 0 ? obra.fotos[0] : '';
    const esExterno     = /placehold\.co|via\.placeholder|placeholder\.com/i.test(fotoCruda);
    const imagenUrl     = (fotoCruda && !esExterno) ? fotoCruda : ph;

    let chipClass = 'chip-disponible', chipText = 'Disponible';
    if (obra.estado === 'Reservada') { chipClass = 'chip-reservada'; chipText = 'Reservada'; }
    else if (obra.estado === 'Vendida') { chipClass = 'chip-vendida'; chipText = 'Vendida'; }

    const card = document.createElement('div');
    card.className = 'obra-card';
    card.style.animationDelay = (i % 10 * 0.04) + 's';
    card.innerHTML = `
      <a href="detalle.html?id=${oid}" class="obra-card-img-wrap">
        <img class="obra-card-img" src="${imagenUrl}" alt="${obra.nombre}"
          loading="lazy" decoding="async"
          onerror="this.onerror=null;this.src='${ph}'">
        <span class="status-chip ${chipClass} obra-status">${chipText}</span>
      </a>
      <div class="obra-card-body">
        <div class="obra-card-title"><a href="detalle.html?id=${oid}">${obra.nombre}</a></div>
        <div class="obra-card-artist">
          ${artistaId ? `<a href="artista.html?id=${artistaId}">${artistaNombre}</a>` : `<span>${artistaNombre}</span>`}
        </div>
        ${obra.motivo ? `<div class="reco-motivo">${obra.motivo}</div>` : ''}
        <div class="obra-card-footer">
          <span class="badge badge-muted">${generoNombre}</span>
          <span class="obra-card-price">${precio.toLocaleString()} $</span>
        </div>
      </div>
    `;
    return card;
  }

  function actualizarFlechasReco() {
    const track = document.getElementById('recoTrack');
    const prev  = document.getElementById('recoPrev');
    const next  = document.getElementById('recoNext');
    const hayMas = track.scrollWidth - track.clientWidth > 4;
    prev.classList.toggle('show', hayMas && track.scrollLeft > 4);
    next.classList.toggle('show', hayMas && track.scrollLeft < track.scrollWidth - track.clientWidth - 4);
  }
  function desplazarReco(dir) {
    const track = document.getElementById('recoTrack');
    track.scrollBy({ left: dir * track.clientWidth, behavior: 'smooth' });
  }

  const elegir = (arr) => arr[Math.floor(Math.random() * arr.length)];

  // Mensaje coherente con el tema que el grafo eligio (genero / artista / colaborativo).
  function mensajeReco(tema) {
    const titulo = elegir([
      'Pensado para ti', 'Inspirado en tu colección', 'Porque tienes buen ojo',
      'Tu próxima obra favorita', 'Hecho a tu gusto', 'Siguiendo tu instinto',
      'Elegido para tu mirada', 'Para seguir coleccionando', 'Una obra te espera',
      'Curaduría a tu medida', 'Lo que viene en tu colección', 'Solo para coleccionistas como tú',
    ]);
    let sub = 'Una selección a partir de lo que has adquirido';
    if (tema && tema.tipo === 'genero') {
      const g = tema.valor;
      sub = elegir([
        `Más obras de ${g} para tu colección`,
        `Porque coleccionas ${g}`,
        `Sigue explorando el mundo de la ${g}`,
        `Tu pasión por la ${g}, en nuevas piezas`,
        `Otras joyas de ${g} que podrían enamorarte`,
        `La ${g} tiene mucho más que mostrarte`,
      ]);
    } else if (tema && tema.tipo === 'artista') {
      const a = tema.valor;
      sub = elegir([
        `Más del trazo de ${a}`,
        `Porque te cautivó ${a}`,
        `Otras piezas de ${a}`,
        `El universo de ${a}, para ti`,
        `Sigue la obra de ${a}`,
        `${a} tiene más que ofrecerte`,
      ]);
    } else if (tema && tema.tipo === 'colaborativo') {
      sub = elegir([
        'Coleccionistas con tu gusto también eligieron esto',
        'Lo que aman quienes compran como tú',
        'Descubrimientos de coleccionistas afines',
        'Gustos parecidos al tuyo se llevaron estas obras',
        'La sabiduría de coleccionistas como tú',
        'Tendencias entre quienes comparten tu mirada',
      ]);
    }
    return { titulo, sub };
  }

  async function cargarRecomendaciones() {
    if (!isLoggedIn()) return;
    const user = getUser();
    const uid = user && (user.id || user.usuario_id);
    if (!uid) return;
    try {
      // Estrategia mix (intercala género, artista y colaborativa); varía en cada visita.
      const res = await fetch(`${API_BASE}/recomendaciones/${uid}?limite=12`);
      if (!res.ok) return;
      const data = await res.json();
      // Excluir la obra que se está viendo
      let recs = (data.recomendaciones || []).filter(r => String(r.obra_id) !== String(obraId));
      if (recs.length === 0) return;

      const msg = mensajeReco(data.tema);
      const tEl = document.getElementById('recoTitle');
      const sEl = document.getElementById('recoSubtitle');
      if (tEl) tEl.textContent = msg.titulo;
      if (sEl) sEl.textContent = msg.sub;

      const mostrarMotivo = data.tema && data.tema.tipo === 'colaborativo';
      const obras = await Promise.all(recs.map(async (r) => {
        let obra = null;
        try {
          const dRes = await fetch(`${API_BASE}/catalogo/${r.obra_id}`);
          if (dRes.ok) { const d = await dRes.json(); if (d && d.data) obra = d.data; }
        } catch (_) {}
        if (!obra) {
          obra = {
            _id: r.obra_id, obra_id: r.obra_id, nombre: r.nombre,
            genero: r.genero, artista_nombre: r.artista,
            precio_venta: r.precio, estado: 'Disponible', fotos: [],
          };
        }
        obra.motivo = mostrarMotivo ? r.motivo : null;
        return obra;
      }));

      const track = document.getElementById('recoTrack');
      track.innerHTML = '';
      obras.forEach((o, i) => track.appendChild(construirObraCard(o, i)));
      document.getElementById('recoSection').style.display = 'block';

      document.getElementById('recoNext').onclick = () => desplazarReco(1);
      document.getElementById('recoPrev').onclick = () => desplazarReco(-1);
      track.addEventListener('scroll', actualizarFlechasReco, { passive: true });
      window.addEventListener('resize', actualizarFlechasReco);
      requestAnimationFrame(actualizarFlechasReco);
    } catch (e) {
      console.error('Error recomendaciones:', e);
    }
  }

  cargarRecomendaciones();
</script>
</body>
</html>

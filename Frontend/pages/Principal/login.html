<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Museo - iniciar sesion</title>
  <link rel="stylesheet" href="/css/museo.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }

    .auth-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2.2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-md);
      animation: fadeUp 0.4s ease;
    }

    .auth-card-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-card-header h2 {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.4rem;
    }
    .auth-card-header p {
      font-size: 0.83rem;
      color: var(--text-light);
    }

    .auth-divider {
      width: 32px;
      height: 1px;
      background: var(--gold);
      margin: 0.8rem auto 0;
    }

    .auth-footer {
      margin-top: 1.2rem;
      text-align: center;
      font-size: 0.83rem;
      color: var(--text-muted);
    }
    .auth-footer a { color: var(--wine); }
    .auth-footer a:hover { color: var(--wine-dark); }

    #msg { margin-top: 0.8rem; }
  </style>
</head>
<body>

<header class="m-header">
  <a class="m-logo" href="../index.html"><img src="/img/logo.png" alt="Museo de arte contemporáneo"></a>
  <nav class="m-nav">
    <a class="btn-secondary" href="registro.html">Registrarse</a>
  </nav>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-card-header">
      <h2>Bienvenido de vuelta</h2>
      <p>Ingresa a tu cuenta del museo</p>
      <div class="auth-divider"></div>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="email">Correo electrónico</label>
        <input class="form-input" type="email" id="email" placeholder="tu@correo.com" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-input" type="password" id="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
      </div>
      <button type="submit" class="btn btn-wine btn-full btn-lg" style="margin-top:.4rem">Entrar</button>
      <div class="msg msg-error" id="msg"></div>
    </form>

    <div class="auth-footer">
      <a href="../Perfiles/recuperar.html">Olvidé mi código de acceso</a>
      <div class="divider" style="margin:.8rem 0"></div>
      <span>¿No tienes cuenta?</span> <a href="registro.html">Regístrate aquí</a>
    </div>
  </div>
</div>

<footer class="m-footer">
  <span>&copy; 2026 Museo de arte contemporáneo</span>
  <a class="footer-github" href="https://github.com/LuisRojas260305/dev_BD_Museo/" target="_blank" aria-label="Repositorio en GitHub"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.74.08-.73.08-.73 1.21.09 1.85 1.24 1.85 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0 2.04.14 3 .4 2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.93.43.37.82 1.1.82 2.22v3.29c0 .32.22.7.83.58C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg></a>
</footer>

<script src="../../js/auth.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const msg  = document.getElementById('msg');
    const email    = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    msg.style.display = 'none';

    const res  = await fetch(`${API_BASE}/usuarios/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (res.ok) {
      setAuth(data.token, data.usuario);
      if (data.usuario.tipo === 'administrador') {
        window.location.href = '../Administrador/admin-dashboard.html';
      } else if (data.usuario.tipo === 'miembro') {
        window.location.href = '../Perfiles/perfil.html';
      } else {
        window.location.href = '../index.html';
      }
    } else {
      msg.className = 'msg msg-error';
      msg.textContent = data.error || 'Credenciales incorrectas.';
      msg.style.display = 'block';
    }
  });
</script>
</body>
</html>

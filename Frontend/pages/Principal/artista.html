<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museo de Arte Contemporáneo - Artista</title>
    <style>
        /* Estilos reutilizados (similar a detalle.html) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            line-height: 1.5;
        }
        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .Titulo {
            text-decoration: none;
            color: white;
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 400;
        }
        .auth-links a {
            color: white;
            text-decoration: none;
            margin-left: 1rem;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            transition: background-color 0.3s;
            cursor: pointer;
        }
        .auth-links .login-btn { background-color: #3498db; }
        .auth-links .logout-btn { background-color: #e67e22; }
        .auth-links .register-btn { background-color: #2ecc71; }
        .auth-links a:hover { opacity: 0.8; }
        .back-link {
            margin: 1rem 2rem;
        }
        .back-link a {
            background-color: #192542;
            color: white;
            margin-left: 1rem;
            padding: 0.3rem 1rem;
            border-bottom-left-radius: 30px;
            border-top-left-radius: 30px;
            text-decoration: none;
            font-size: 1.1rem;
        }
        .back-link a:hover {
             box-shadow: #152779 0px 0px 5px;
        }
        .artist-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .artist-header {
            display: flex;
            gap: 2rem;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .artist-photo {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
            background-color: #ddd;
        }
        .artist-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }


        .artist-info h2 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }
        .artist-info p {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 0.5rem;
        }
        .artist-bio {
            margin-top: 2rem;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #444;
        }
        .obras-title {
            font-size: 1.8rem;
            margin: 2rem 0 1rem;
            color: #2c3e50;
        }
        .obras-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }
        .obra-card {
            background-color: #f9f9f9;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .obra-card:hover {
            transform: translateY(-5px);
        }
        .obra-image {
            height: 150px;
            overflow: hidden;
            background-color: #ccc;
        }
        .obra-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .obra-info {
            padding: 1rem;
        }
        .obra-info h4 {
            margin-bottom: 0.3rem;
            color: #2c3e50;
        }
        .obra-info p {
            color: #27ae60;
            font-weight: bold;
        }
        .obra-info a {
            text-decoration: none;
            color: inherit;
        }
        .not-found {
            text-align: center;
            padding: 3rem;
            font-size: 1.5rem;
            color: #777;
        }

        .a-obras{
            text-decoration: none;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1><a class="Titulo" href="../index.html">🎨 Museo de Arte Contemporáneo</a></h1>
        </div>
        <div class="auth-links" id="authLinks"></div>
    </header>

    <div class="back-link">
        <a href="../index.html">&larr; Volver al catálogo</a>
    </div>

    <main id="artistMain" class="artist-container">
    </main>

    <footer>
        <p>&copy; 2026 Museo de Arte Contemporáneo - Proyecto Final</p>
    </footer>
    <script src="../../js/auth.js"></script>
    <script>
        /**
         * Página de detalle de un artista.
         * Muestra su foto, datos biográficos, fecha de nacimiento, nacionalidad,
         * géneros artísticos y la lista de sus obras disponibles.
         *
         * APIs utilizadas:
         * - GET /api/catalogo/artistas/{id}
         * - GET /api/catalogo?artista_id={id}
         */
        const urlParams = new URLSearchParams(window.location.search);
        const artistaId = urlParams.get('id');

        /**
         * Carga los datos del artista y sus obras desde el catálogo.
         * @async
         */
        async function cargarArtista() {
            try {
                // Usar SOLO MongoDB via proxy — sin MySQL
                const resArtista = await fetch(`${API_BASE}/catalogo/artistas/${artistaId}`);
                if (!resArtista.ok) throw new Error('Artista no encontrado');
                const jsonArtista = await resArtista.json();
                const artista = jsonArtista.data;

                const resObras = await fetch(`${API_BASE}/catalogo?artista_id=${artistaId}`);
                const jsonObras = await resObras.json();
                const obras = jsonObras.data || [];

                renderizar(artista, obras);
            } catch (error) {
                document.getElementById('artistMain').innerHTML = `<div class="not-found">${error.message}</div>`;
            }
        }

        /**
         * Renderiza la página de detalle del artista: foto, datos biográficos,
         * nacionalidad, géneros, fecha de nacimiento, y parrilla de sus obras.
         *
         * @param {Object} artista - Datos del artista desde la API.
         * @param {Array} obras - Lista de obras del artista.
         */
        function renderizar(artista, obras) {
            const fotoArtistaUrl = artista.fotos && artista.fotos.length > 0
                ? artista.fotos[0]
                : 'https://via.placeholder.com/200x200?text=Sin+imagen';

            /**
             * Formatea una fecha ISO a YYYY-MM-DD.
             * @param {string} fechaISO - Fecha en formato ISO (ej: 1475-03-06T04:27:44.000Z).
             * @returns {string} Fecha formateada o 'Desconocida'.
             */
            const formatearFecha = (fechaISO) => {
                if (!fechaISO) return 'Desconocida';
                return fechaISO.split('T')[0];
            };

            let obrasHTML = '';
            obras.forEach(obra => {
                const obraId = obra.obra_id || obra.obra_id_original || obra._id;
                const fotoObraUrl = obra.fotos && obra.fotos.length > 0
                    ? obra.fotos[0]
                    : 'https://via.placeholder.com/200x150?text=Sin+imagen';
                obrasHTML += `
                    <div class="obra-card">
                        <a class="a-obras" href="detalle.html?id=${obraId}">
                            <div class="obra-image">
                                <img src="${fotoObraUrl}" 
                                    alt="${obra.nombre}"
                                    onerror="this.onerror=null; this.src='https://via.placeholder.com/200x150?text=Sin+imagen';"
                                    style="width:100%; height:100%; object-fit:cover;">
                            </div>
                            <div class="obra-info">
                                <h4>${obra.nombre}</h4>
                                <p>$${Number(obra.precio_venta).toLocaleString()}</p>
                            </div>
                        </a>
                    </div>
                `;
            });

            /**
             * Convierte la lista de géneros artísticos a un string plano.
             * Maneja arrays, strings JSON y valores planos.
             * @param {Array|string} generos - Lista de géneros artísticos.
             * @returns {string} Géneros formateados como texto.
             */
            const formatearGeneros = (generos) => {
                if (!generos) return '';
                if (Array.isArray(generos)) return generos.join(', ');
                // Si por algún motivo es un string con formato de array, intentamos limpiarlo
                if (typeof generos === 'string') {
                    try {
                        const parsed = JSON.parse(generos);
                        return Array.isArray(parsed) ? parsed.join(', ') : generos;
                    } catch { return generos; }
                }
                return String(generos);
            };

            const main = document.getElementById('artistMain');
            main.innerHTML = `
                <div class="artist-header">
                    <div class="artist-photo">
                        <img src="${fotoArtistaUrl}" 
                            alt="${artista.nombre} ${artista.apellido || ''}"
                            onerror="this.onerror=null; this.src='https://via.placeholder.com/200x200?text=Sin+imagen';"
                            style="width:100%; height:100%; object-fit:cover; border-radius:50%;">
                    </div>
                    <div class="artist-info">
                        <h2>${artista.nombre} ${artista.apellido || ''}</h2>
                        <p><strong>Nacionalidad:</strong> ${artista.nacionalidad || 'Desconocida'}</p>
                        <p><strong>Géneros artísticos:</strong> ${formatearGeneros(artista.generos_artisticos)}</p>
                        <p><strong>Fecha de nacimiento:</strong> ${formatearFecha(artista.fecha_nacimiento)}</p>
                    </div>
                </div>
                <div class="artist-bio">
                    <h3>Biografía</h3>
                    <p>${artista.biografia || 'Sin biografía disponible.'}</p>
                </div>
                <h3 class="obras-title">Obras de ${artista.nombre}</h3>
                <div class="obras-grid">${obrasHTML || '<p>No hay obras de este artista.</p>'}</div>
            `;
        }
        cargarArtista();
    </script>
</body>
</html>

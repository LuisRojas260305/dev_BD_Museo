<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Museo - activar membresía</title>
  <link rel="stylesheet" href="/css/museo.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .page-wrap { max-width: 540px; margin: 0 auto; padding: 2rem 1.5rem; flex: 1; }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 2.2rem;
      box-shadow: var(--shadow-md);
      animation: fadeUp 0.4s ease;
    }
    .auth-card h2 { font-family: var(--font-serif); font-size: 1.4rem; font-weight: 400; margin-bottom: 0.3rem; }
    .auth-card p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem; }
    .section-sub { font-family: var(--font-serif); font-size: 1rem; font-weight: 500; color: var(--text); margin: 1.2rem 0 0.8rem; padding-top: 1rem; border-top: 1px solid var(--border-light); }
    .error-msg { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; border-radius: var(--radius-sm); padding: 0.6rem 0.9rem; font-size: 0.85rem; margin-top: 0.5rem; display: none; }
  </style>
</head>
<body>

<header class="m-header">
  <a class="m-logo" href="../index.html"><img src="/img/logo.png" alt="Museo de arte contemporáneo"></a>
  <nav class="m-nav">
    <a href="perfil.html" class="btn-secondary">Mi perfil</a>
    <a class="btn-ghost" style="cursor:pointer" onclick="logout()">Salir</a>
  </nav>
</header>

<div class="page-wrap">
  <a class="back-link" href="perfil.html">Volver a mi perfil</a>
  <div class="auth-card" style="margin-top:1rem">
    <h2>Activar membresía</h2>
    <p>Accede a la compra de obras y beneficios exclusivos</p>

    <form id="membresiaForm">
      <div class="section-sub">Datos de pago</div>
      <div class="form-group">
        <label class="form-label">Número de tarjeta</label>
        <input class="form-input" type="text" id="tarjeta_numero" placeholder="0000 0000 0000 0000" required>
      </div>
      <div class="form-group">
        <label class="form-label">Nombre en la tarjeta</label>
        <input class="form-input" type="text" id="tarjeta_nombre" required>
      </div>
      <div class="form-group">
        <label class="form-label">Expiración</label>
        <input class="form-input" type="text" id="tarjeta_expiracion" placeholder="MM/AA" required>
      </div>

      <div class="section-sub">Preguntas de seguridad</div>
      <p style="font-size:.82rem;color:var(--text-muted);margin-bottom:.8rem">Selecciona 3 preguntas diferentes. Las necesitarás para recuperar tu cuenta.</p>
      <div id="preguntasContainer"></div>

      <button type="submit" class="btn btn-wine btn-full btn-lg" style="margin-top:1rem">Pagar y activar</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>
  </div>
</div>

<footer class="m-footer"><span>&copy; 2026 Museo de arte contemporáneo</span>
  <a class="footer-github" href="https://github.com/LuisRojas260305/dev_BD_Museo/" target="_blank" aria-label="Repositorio en GitHub"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.74.08-.73.08-.73 1.21.09 1.85 1.24 1.85 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0 2.04.14 3 .4 2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.93.43.37.82 1.1.82 2.22v3.29c0 .32.22.7.83.58C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg></a></footer>

<script src="../../js/auth.js"></script>
<script>
  async function cargarPreguntas() {
    try {
      const res = await fetch(`${API_BASE}/preguntas-seguridad`);
      const preguntas = await res.json();
      const container = document.getElementById('preguntasContainer');
      for (let i = 1; i <= 3; i++) {
        const div = document.createElement('div');
        div.className = 'form-group';
        div.innerHTML = `
          <label class="form-label">Pregunta ${i}</label>
          <select class="form-select" id="pregunta${i}" required>
            <option value="">Seleccionar...</option>
            ${preguntas.map(p => `<option value="${p.pregunta_id}">${p.pregunta_texto}</option>`).join('')}
          </select>
          <input class="form-input" style="margin-top:.4rem" type="text" id="respuesta${i}" placeholder="Tu respuesta" required>
        `;
        container.appendChild(div);
      }
    } catch (e) {
      document.getElementById('errorMsg').innerText = 'Error al cargar preguntas';
      document.getElementById('errorMsg').style.display = 'block';
    }
  }

  document.getElementById('membresiaForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const errEl = document.getElementById('errorMsg');
    errEl.style.display = 'none';
    const resM = await authFetch(`${API_BASE}/usuarios/membresia`, {
      method: 'POST',
      body: JSON.stringify({
        tarjeta_numero: document.getElementById('tarjeta_numero').value,
        tarjeta_nombre: document.getElementById('tarjeta_nombre').value,
        tarjeta_expiracion: document.getElementById('tarjeta_expiracion').value
      })
    });
    const dataM = await resM.json();
    if (!resM.ok) { errEl.innerText = dataM.error; errEl.style.display = 'block'; return; }

    const respuestas = [];
    for (let i = 1; i <= 3; i++) {
      respuestas.push({ pregunta_id: document.getElementById(`pregunta${i}`).value, respuesta: document.getElementById(`respuesta${i}`).value });
    }
    const resS = await authFetch(`${API_BASE}/usuarios/seguridad`, { method: 'POST', body: JSON.stringify({ respuestas }) });
    if (resS.ok) {
      alert(`Membresía activada. Tu código es: ${dataM.codigo_seguridad}`);
      window.location.href = 'perfil.html';
    } else {
      const err = await resS.json();
      errEl.innerText = err.error;
      errEl.style.display = 'block';
    }
  });

  cargarPreguntas();
</script>
</body>
</html>
